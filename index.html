<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2F72FF"><meta name="description" content="PetMate keeps your pet's routine, medications, vaccines and health in one record, and shares the right part with sitters, kennels and vets."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PetMate"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PetMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,500,0..1,0&display=block">
<style>
:root{
  --page:#E7EDFA; --bg:#F5F7FD; --surface:#FFFFFF; --surface-2:#F0F4FC;
  --ink:#0F2D6B; --ink-2:#34487A; --muted:#62739C; --faint:#A3B0CF; --line:#E1E7F4;
  --blue:#2F72FF; --blue-ink:#1F5AE0; --blue-soft:#EAF1FF; --on-blue:#FFFFFF;
  --mint:#4ED7B8; --mint-ink:#0B7F67; --mint-soft:#E2F7F1;
  --violet:#7B55C9; --violet-soft:#F2EBFE;
  --red:#D64545; --coral:#FF6B6B; --red-soft:#FFECEC;
  --amber:#A8560A; --amber-soft:#FFF1D6;
  --sun:#FFF6D8; --sun-2:#FFE9A8;
  --shadow:0 1px 2px rgba(15,45,107,.06),0 8px 24px rgba(15,45,107,.06);
  --display:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#070C1D; --bg:#0D1531; --surface:#152046; --surface-2:#1A2752;
    --ink:#E9EFFF; --ink-2:#C3CEEE; --muted:#9AA8D2; --faint:#5D6B98; --line:#26345F;
    --blue:#5E8FFF; --blue-ink:#8AAEFF; --blue-soft:#1C2C60; --on-blue:#FFFFFF;
    --mint:#4ED7B8; --mint-ink:#63E2C5; --mint-soft:#10393A;
    --violet:#B69CF2; --violet-soft:#2A2253;
    --red:#FF7B7B; --coral:#FF7B7B; --red-soft:#3B1B2A;
    --amber:#F2B25E; --amber-soft:#3A2B15;
    --sun:#1E2446; --sun-2:#3A3A2A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#070C1D; --bg:#0D1531; --surface:#152046; --surface-2:#1A2752;
  --ink:#E9EFFF; --ink-2:#C3CEEE; --muted:#9AA8D2; --faint:#5D6B98; --line:#26345F;
  --blue:#5E8FFF; --blue-ink:#8AAEFF; --blue-soft:#1C2C60; --on-blue:#FFFFFF;
  --mint:#4ED7B8; --mint-ink:#63E2C5; --mint-soft:#10393A;
  --violet:#B69CF2; --violet-soft:#2A2253;
  --red:#FF7B7B; --coral:#FF7B7B; --red-soft:#3B1B2A;
  --amber:#F2B25E; --amber-soft:#3A2B15;
  --sun:#1E2446; --sun-2:#3A3A2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font:600 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;user-select:none;flex:none;width:1em;overflow:hidden}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{height:100%}
.shell{height:100%;display:flex;justify-content:center;gap:28px;padding-block:24px;padding-inline:24px}
.rail{width:260px;flex:none;display:flex;flex-direction:column;gap:18px;overflow-y:auto;padding-block:4px}
.brand{display:flex;align-items:center;gap:10px;font:700 24px var(--display);color:var(--ink)}
.brand .logo{width:40px;height:40px;border-radius:13px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center}
.rail p{margin:0;color:var(--muted);font-size:13px}
.rail-group{display:flex;flex-direction:column;gap:2px}
.rail-group h4{margin:0 0 4px;font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rail-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-weight:700;color:var(--ink-2);text-align:left;width:100%}
.rail-link:hover{background:var(--surface)}
.rail-link.on{background:var(--surface);color:var(--blue);box-shadow:var(--shadow)}
.rail-link .ms{font-size:20px}
.phone{position:relative;width:100%;max-width:430px;height:100%;max-height:920px;background:var(--bg);border-radius:34px;box-shadow:0 30px 80px rgba(15,45,107,.18),0 0 0 1px var(--line);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:900px){ .rail{display:none} }
@media (max-width:520px){
  .shell{padding:0}
  .phone{max-width:none;max-height:none;border-radius:0;box-shadow:none}
}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen{padding:18px 18px 28px;display:flex;flex-direction:column;gap:18px;animation:up .28s ease both}
@keyframes up{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--display);margin:0;color:var(--ink);text-wrap:balance;font-weight:600}
h1{font-size:27px;line-height:1.15}
h2{font-size:19px;line-height:1.2}
h3{font-size:16px}
.lede{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.eyebrow{font:800 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.stack.tight{gap:6px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;min-height:44px}
.topbar h2{flex:1}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;flex:none}
.iconbtn:hover{box-shadow:0 0 0 1.5px var(--blue) inset}
.ai-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--violet-soft);color:var(--violet);font:800 12px var(--body)}
.ai-pill .ms{font-size:16px}
.mode{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:800 12px var(--body)}
.mode.live{background:var(--mint-soft);color:var(--mint-ink)}
.mode.demo{background:var(--amber-soft);color:var(--amber)}
.mode .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- controls ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.label{font:800 13px var(--body);color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--red);font-weight:800}
.input,.select,.textarea{width:100%;min-height:50px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font:700 16px var(--body);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.textarea{padding:12px 14px;min-height:110px;resize:vertical;line-height:1.5;font-weight:600;font-size:15px}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent)}
.input.bad{border-color:var(--red)}
.input.warn{border-color:color-mix(in srgb,var(--coral) 55%,var(--line));background:color-mix(in srgb,var(--red-soft) 70%,var(--surface))}
.input[readonly]{background:var(--surface-2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;background:var(--blue);color:var(--on-blue);font:800 16px var(--body);transition:transform .1s,filter .15s;width:100%}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.mint{background:var(--mint);color:#063B30}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;width:auto}
.btn.inline{width:auto}
.btn .ms{font-size:20px}
.linkbtn{color:var(--blue);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font:800 14px var(--body);color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip.on.navy{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.chip.on.violet{background:var(--violet);border-color:var(--violet);color:#fff}
.chip .ms{font-size:18px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:800 12px var(--body);white-space:nowrap}
.tag .ms{font-size:14px}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.mint{background:var(--mint-soft);color:var(--mint-ink)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.blue{background:var(--blue-soft);color:var(--blue-ink)}
.tag.violet{background:var(--violet-soft);color:var(--violet)}
.tag.gray{background:var(--surface-2);color:var(--muted)}
.switch{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--mint)}
.switch.on::after{left:23px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:0 0 0 1.5px var(--line) inset}
.panel{background:var(--surface-2);border-radius:18px;padding:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.note .ms{font-size:20px;margin-top:1px}
.note.blue{background:var(--blue-soft);color:var(--ink)}
.note.blue .ms{color:var(--blue)}
.note.amber{background:var(--amber-soft);color:var(--ink)}
.note.amber .ms{color:var(--amber)}
.note.red{background:var(--red-soft);color:var(--ink)}
.note.red .ms{color:var(--red)}
.note.mint{background:var(--mint-soft);color:var(--ink)}
.note.mint .ms{color:var(--mint-ink)}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* kinds */
.kind{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.kind .ms{font-size:21px}
.k-food{background:var(--blue-soft);color:var(--blue)}
.k-med{background:var(--violet-soft);color:var(--violet)}
.k-walk{background:var(--mint-soft);color:var(--mint-ink)}
.k-care{background:var(--red-soft);color:var(--red)}
.k-sun{background:var(--amber-soft);color:var(--amber)}

/* checklist */
.task{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;flex:none;background:var(--surface);transition:all .15s}
.check .ms{font-size:18px;color:#063B30;opacity:0}
.check.on{background:var(--mint);border-color:var(--mint)}
.check.on .ms{opacity:1}
.task .t-title{font-weight:800;color:var(--ink);font-size:15px;line-height:1.3}
.task.done .t-title{color:var(--muted);text-decoration:line-through}
.task .t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center}
.time{font:800 13px var(--body);color:var(--blue-ink);white-space:nowrap}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .3s}

/* pet header */
.avatar{width:64px;height:64px;border-radius:22px;background:var(--sun-2);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--amber)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .ms{font-size:34px}
.avatar.lg{width:88px;height:88px;border-radius:28px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;background:var(--surface-2);flex:1;min-width:0}
.stat b{font:600 18px var(--display);color:var(--ink)}
.stat span{font-size:12px;color:var(--muted);font-weight:800}
.kv{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:12.5px;color:var(--muted);font-weight:800}
.kv .v{font-weight:800;color:var(--ink);font-size:15px;overflow-wrap:anywhere}

/* tools grid */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.tool:hover{box-shadow:0 0 0 2px var(--blue) inset,var(--shadow)}
.tool b{font-weight:900;font-size:14.5px;color:var(--ink)}
.tool span{font-size:12.5px;color:var(--muted);line-height:1.3}

/* tab bar */
.tabbar{display:flex;justify-content:space-around;align-items:flex-end;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font:800 11.5px var(--body);color:var(--muted);min-width:56px;max-width:76px}
.tab span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tab.on{color:var(--blue)}
.tab .ms{font-size:25px}
.tab.mid .bub{width:54px;height:54px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 40%,transparent)}
.tab.mid .ms{font-size:26px}

/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(8,16,40,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:sheet .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheet{from{transform:translateY(40px);opacity:.5}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.toast{position:absolute;left:16px;right:16px;top:14px;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:up .25s both}
.toast.err{background:var(--red);color:#fff}
.linkbox{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 13.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--blue-ink);user-select:all}

/* welcome */
.welcome{background:var(--sun);min-height:100%;padding:28px 22px;display:flex;flex-direction:column;gap:22px;justify-content:space-between}
.hero-art{position:relative;height:250px;border-radius:32px;background:linear-gradient(160deg,var(--sun-2),color-mix(in srgb,var(--mint) 35%,var(--sun-2)));overflow:hidden}
.hero-art .ms{position:absolute;color:var(--ink)}
.welcome h1{font-size:34px;line-height:1.08}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:84%;padding:11px 14px;border-radius:20px;font-size:15px;line-height:1.45;white-space:pre-line}
.bubble.me{align-self:flex-end;background:var(--blue);color:var(--on-blue);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.composer{display:flex;gap:8px;padding:10px 14px;background:var(--bg);border-top:1px solid var(--line)}
.composer .input{border-radius:999px}
.sendbtn{width:50px;height:50px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;flex:none}

/* urgency */
.urgency{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px}
.meter{display:flex;gap:6px}
.meter i{flex:1;height:8px;border-radius:9px;background:currentColor;opacity:.25}
.meter i.on{opacity:1}

/* editable task rows */
.etask{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px;border-radius:18px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset}
.etask .input{min-height:40px;border-radius:11px;font-size:15px;padding:0 10px}
.etask .mini{min-height:34px;font-size:13px;border-radius:10px;padding:0 8px;width:auto}
.etask-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.drop{border:2px dashed var(--faint);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface);color:var(--muted)}
.drop img{max-height:220px;border-radius:14px}
.table-wrap{overflow-x:auto;border-radius:16px;box-shadow:0 0 0 1.5px var(--line) inset}
table.map{border-collapse:collapse;width:100%;font-size:13px}
table.map th,table.map td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.map th{font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
table.map td code,.mono{font:700 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--blue-ink)}
table.map tr:last-child td{border-bottom:0}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:grid;place-items:center;min-height:60%;gap:12px;text-align:center;padding:40px 20px}
.logo-wordmark{display:block;height:auto;max-width:100%}
.logo-stacked{display:block;height:auto;max-width:100%}
.app-icon{border-radius:13px;flex:none}
.handoff-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#0F2D6B;color:#fff}
.handoff-head img{border-radius:11px;flex:none}
.welcome{background:linear-gradient(180deg,var(--sun) 0%,var(--bg) 62%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>

      const dur = s.match(/(\d+)\s*(min|mins|minutes|hour|hours|hr)\b/i);
      (times.length ? times : ['08:00']).forEach(t => tasks.push({ time: t, title: `${partOfDay(t)} walk${dur ? ` · ${dur[1]} ${/h/i.test(dur[2]) ? 'hr' : 'min'}` : ''}`, kind: 'walk', freq, warn }));
      continue;
    }
    if (/\b(eat|eats|feed|fed|meal|meals|kibble|food|breakfast|dinner|lunch)\b/i.test(s)) {
      const p = s.match(/(\d+(?:\.\d+)?|half|one|two)\s*(cups?|g|grams|scoops?|cans?|pouch(?:es)?|bowls?)\s*(?:of\s+)?([a-z][a-z -]*?)(?=\s+(?:at|in|and|twice|once|every|each)\b|[,.;!]|$)/i);
      (times.length ? times : ['08:00', '19:00']).forEach(t => tasks.push({ time: t, title: `${mealName(t)}${p ? ` · ${p[1]} ${p[2]} ${p[3]}`.replace(/\s+/g, ' ') : ''}`, kind: 'food', freq, warn }));
      continue;
    }
    // generic care task
    let title = s.replace(/[.!]+$/, '')
      .replace(/\b(every other|every|once a|twice a)\s+(day|night|morning|evening|week|month)\b/gi, '')
      .replace(/\b(at\s+)?\d{1,2}(:\d{2})?\s*(am|pm)\b/gi, '')
      .replace(/\b(in the\s+)?(morning|evening|night|bedtime|daily|weekly|monthly)\b/gi, '')
      .replace(/(?<!\b(?:with|to|for|on|at|by)\s)\b(his|her|their|its)\s+(?=[a-z])/gi, '').replace(/\s+/g, ' ').trim();
    if (warn) title = title.replace(new RegExp(warn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '').replace(/,?\s*(but|and)?\s*$/i, '').trim();
    if (!title) continue;
    (times.length ? times : [freq === 'as_needed' ? '12:00' : '21:00']).forEach(t => tasks.push({ time: t, title: cap(title).slice(0, 80), kind: 'care', freq, warn }));
  }
  // allergy → default warning on food tasks
  if (allergies.length) tasks.filter(t => t.kind === 'food' && !t.warn).forEach(t => t.warn = `No ${allergies.join(', ')}`);
  tasks.sort((a, b) => a.time.localeCompare(b.time));
  return { tasks: tasks.map((t, i) => ({ ...t, key: uid(), sort: i })), notes, allergies: [...new Set(allergies)], warnings };
}

/* ===================== Prescription label parser ===================== */
const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
function parsePrescription(text, petName) {
  const s = String(text || '').replace(/\s+/g, ' ');
  const name = findDrug(s, petName);
  const giveM = s.match(/\bgive\s+(\d+(?:\.\d+)?\s*(?:mg|ml|mcg|tablets?|tabs?|drops?|capsules?|chews?|½|half)[a-z]*)/i);
  const dose = giveM ? giveM[1].replace(/\s+/g, ' ') : findDose(s);
  let perDay = 1, freq = 'daily';
  if (/\b(twice|bid|b\.i\.d|every 12 ?h(ours?)?|2 times)/i.test(s)) perDay = 2;
  else if (/\b(three times|tid|t\.i\.d|every 8 ?h(ours?)?|3 times)/i.test(s)) perDay = 3;
  if (/\b(weekly|once a week|every week)\b/i.test(s)) freq = 'weekly';
  else if (/\b(monthly|once a month|every month)\b/i.test(s)) freq = 'monthly';
  else if (/\b(as needed|when needed|prn)\b/i.test(s)) freq = 'as_needed';
  else if (/every other day|alternate days/i.test(s)) freq = 'every_other_day';
  const withFood = /\bwith (food|a meal|meals|breakfast|dinner)|after (food|meals?)|\bwith food\b/i.test(s);
  let start = todayISO();
  const st = s.match(/start(?:ing|s)?\s*(?:on\s*)?(\d{1,2})\s+([A-Za-z]{3,9})\.?(?:\s+(\d{4}))?/i);
  if (st && MONTHS[st[2].slice(0, 3).toLowerCase()] !== undefined) {
    const y = st[3] ? +st[3] : new Date().getFullYear();
    start = isoOf(new Date(y, MONTHS[st[2].slice(0, 3).toLowerCase()], +st[1]));
  }
  const dur = s.match(/for\s+(\d+)\s+(days?|weeks?)/i);
  const end = dur ? addDays(start, (+dur[1]) * (/week/i.test(dur[2]) ? 7 : 1) - 1) : '';
  const instr = (s.match(/(?:^|[.!?]\s)([^.!?]*?\bgive\b.*?[.!?])(?=\s|$)/i) || ['', ''])[1].trim();
  const vet = (s.match(/\bDr\.?\s+[A-Z][\w.]*(?:\s+[A-Z][\w]*)?/) || [''])[0];
  return { name, dose, perDay, freq, withFood, start, end, instructions: instr, vet };
}

/* ===================== Symptom urgency (general guidance, rule-based) ===================== */
const EMCHIPS = ['Vomiting', 'Diarrhoea', 'Limping', 'Not eating', 'Lethargic', 'Ate something toxic', 'Breathing trouble', 'Seizure', 'Bleeding', 'Collapsed'];
const LEVELS = {
  emergency: { label: 'Emergency, go now', icon: 'e911_emergency', tone: 'red', bars: 3, desc: 'Symptoms like these can get worse quickly. Head to a 24/7 clinic now and call on the way.', steps: ['Keep your pet calm, warm and still', 'Bring any packaging if something was eaten', "Don't make your pet vomit unless a vet tells you to"] },
  today: { label: 'See a vet today', icon: 'schedule', tone: 'amber', bars: 2, desc: 'Not an emergency right now, but your pet should be seen within the next few hours.', steps: ['Take food away for now, keep water available', 'Note the time each time it happens', 'Call your vet to book a same-day slot'] },
  monitor: { label: 'Monitor at home', icon: 'visibility', tone: 'mint', bars: 1, desc: 'This sounds mild. Keep an eye on things for the next 24 hours.', steps: ['Keep the routine normal and calm', 'Check again in a few hours', 'Call the vet if it gets worse or new symptoms appear'] },
};
function urgencyOf(chips, text) {
  const t = String(text || '').toLowerCase();
  if (['Breathing trouble', 'Seizure', 'Ate something toxic', 'Collapsed', 'Bleeding'].some(x => chips.includes(x)) || /choc|grape|raisin|poison|xylitol|rat bait|antifreeze|onion|breath|seiz|collaps|blood|bloat|swollen belly|unconscious|hit by/.test(t)) return 'emergency';
  if (['Vomiting', 'Diarrhoea', 'Limping', 'Not eating'].some(x => chips.includes(x)) || /vomit|threw up|throwing up|diarrh|limp|not eating|won't eat/.test(t)) return 'today';
  return 'monitor';
}

    async profile() { return clone(db.owner); },

    async pets() {
      return clone(db.pets.map(p => ({ ...p, pet_health: db.health[p.id] || { allergies: [], conditions: [] }, vet: db.vets.find(v => v.id === p.primary_vet_id) || null })));

      if (done) db.completions.push({ task_id: taskId, completed_on: day });

    async toggleDose(scheduleId, day, given) {
      db.doseLogs = db.doseLogs.filter(d => !(d.schedule_id === scheduleId && d.dose_date === day));
      if (given) db.doseLogs.push({ schedule_id: scheduleId, dose_date: day });
    },
    async saveRoutine(petId, sourceText, draft) {
      let routineId = null;
      if (sourceText) { routineId = uid(); db.routines.push({ id: routineId, pet_id: petId, source_text: sourceText, created_at: new Date().toISOString() }); }
      const keep = new Set(draft.filter(d => d.id).map(d => d.id));
      db.tasks.filter(t => t.pet_id === petId && t.is_active && !keep.has(t.id)).forEach(t => t.is_active = false);

    async addMedication(petId, med, schedules) {
      const id = uid();
      db.meds.push({ id, pet_id: petId, is_active: true, created_at: new Date().toISOString(), ...med });
      schedules.forEach(s => db.schedules.push({ id: uid(), medication_id: id, frequency: 'daily', ...s }));
      return id;
    },
    async stopMedication(id) { Object.assign(db.meds.find(m => m.id === id), { is_active: false, end_date: todayISO() }); },
    async addVaccination(v) { db.vaccinations.push({ id: uid(), created_at: todayISO(), reminder_enabled: true, ...v }); },
    async addWeight(petId, kg, on) { db.weights.push({ id: uid(), pet_id: petId, weight_kg: +kg, logged_on: on, source: 'owner' }); db.pets.find(p => p.id === petId).weight_kg = +kg; },
    async createShare(petId, role, expiresAt) { const token = Math.random().toString(16).slice(2, 14) + Math.random().toString(16).slice(2, 14); db.shares.push({ id: uid(), pet_id: petId, role, token, expires_at: expiresAt, revoked_at: null, created_at: new Date().toISOString() }); return token; },
    async revokeShare(id) { db.shares.find(s => s.id === id).revoked_at = new Date().toISOString(); },
    async getShare(token) { return demoGetShare(db, token, tasksForDay); },
    async upload(bucket, file) { const path = `demo/${Date.now()}-${file.name}`; db.files[path] = URL.createObjectURL(file); return path; },
    async fileUrl(bucket, path) { return db.files[path] || null; },
    async addDocument(petId, docType, path) { const id = uid(); db.documents.push({ id, pet_id: petId, doc_type: docType, storage_path: path, status: 'uploaded', extracted: {}, created_at: new Date().toISOString() }); return id; },
    async confirmDocument(id, extracted) { Object.assign(db.documents.find(d => d.id === id), { status: 'confirmed', extracted }); },
    async addSymptomCheck(row) { db.symptoms.push({ id: uid(), created_at: new Date().toISOString(), ...row }); },
    async addChat(petId, role, content, sources) { db.chat.push({ id: uid(), pet_id: petId, role, content, sources: sources || [], created_at: new Date().toISOString() }); },
  };
  return api;
}

/* Mirrors SQL public.get_share(): what each caregiver role may see */
function demoGetShare(db, token, tasksForDay) {
  const l = db.shares.find(s => s.token === token);
  if (!l || l.revoked_at || (l.expires_at && l.expires_at < new Date().toISOString())) return { error: 'This link has expired or been revoked.' };
  const pt = db.pets.find(p => p.id === l.pet_id), h = db.health[pt.id] || { allergies: [], conditions: [] }, vt = db.vets.find(v => v.id === pt.primary_vet_id), o = db.owner;
  const tasks = tasksForDay(pt.id, todayISO()).map(({ time_of_day, title, kind, frequency, warning }) => ({ time_of_day, title, kind, frequency, warning }));
  const meds = db.meds.filter(m => m.pet_id === pt.id && m.is_active);
  const vax = db.vaccinations.filter(v => v.pet_id === pt.id);
  const base = { role: l.role, expires_at: l.expires_at, pet: { name: pt.name, species: pt.species, breed: pt.breed }, allergies: h.allergies };
  switch (l.role) {
    case 'routine': return { ...base, tasks };
    case 'sitter': return { ...base, tasks, medications: meds.map(m => ({ name: m.name, dose: m.dose, instructions: m.instructions, with_food: m.with_food })), vet: vt ? { doctor: vt.doctor_name, clinic: vt.clinic_name, phone: vt.phone, is_24x7: vt.is_24x7 } : null, owner_phone: o.phone };
    case 'kennel': return { ...base, conditions: h.conditions, vaccinations: vax.map(v => ({ vaccine: v.vaccine_name, given_on: v.given_on, due_on: v.due_on })), feeding_and_meds: tasks.filter(t => ['food', 'med'].includes(t.kind)) };
    case 'vet': return { ...base, patient: { birth_date: pt.birth_date, sex: pt.sex, is_neutered: pt.is_neutered, weight_kg: pt.weight_kg, microchip_no: pt.microchip_no }, conditions: h.conditions, medications: meds.map(m => ({ name: m.name, dose: m.dose, instructions: m.instructions })), vaccinations: vax.map(v => ({ vaccine: v.vaccine_name, given_on: v.given_on, due_on: v.due_on, batch_no: v.batch_no })), recent_symptoms: db.symptoms.filter(s => s.pet_id === pt.id).slice(-5).reverse().map(s => ({ on: s.created_at, symptoms: s.symptoms, description: s.description, urgency: s.urgency })) };
    case 'walker': return { ...base, walks: tasks.filter(t => t.kind === 'walk'), owner: { name: o.full_name, phone: o.phone } };
  }
}

function friendly(e) {
  const m = e?.message || String(e);
  const wait = m.match(/after (\d+) seconds?/i);
  if (wait) return new Error(`Please wait ${wait[1]} seconds before requesting another email.`);
  if (/email rate limit|over_email_send_rate_limit/i.test(m) || e?.code === 'over_email_send_rate_limit') return new Error('The hourly limit for PetMate emails has been reached. Try again in up to an hour, or use the code from an email you already received.');
  if (/rate limit|too many/i.test(m)) return new Error('Too many attempts just now. Wait a few minutes and try again.');
  if (/invalid login credentials|invalid_credentials/i.test(m + (e?.code || ''))) return new Error('Email or password is wrong. Check both, or use "Forgot password".');
  if (/email not confirmed|email_not_confirmed/i.test(m + (e?.code || ''))) { const x = new Error('Confirm your email first. Enter the code from the PetMate confirmation email.'); x.code = 'email_not_confirmed'; return x; }
  if (/already registered|user_already_exists/i.test(m + (e?.code || ''))) return new Error('An account with this email already exists. Sign in instead.');
  if (/signups? not allowed|signup_disabled/i.test(m + (e?.code || ''))) return new Error('New sign-ups are switched off. Ask PetMate to create your account.');
  if (/weak_password|password should|password is known/i.test(m + (e?.code || ''))) return new Error('Choose a stronger password: at least 8 characters, mixing letters and numbers, and not a common one.');
  if (/same_password|different from the old/i.test(m + (e?.code || ''))) return new Error('The new password must be different from your old one.');
  if (/otp_expired|token has expired|invalid/i.test(m) && /otp|token|code/i.test(m + (e?.code || ''))) return new Error('That code is wrong, expired, or was replaced by a newer email. Use the code from the most recent PetMate email.');
  if (/microchip/i.test(m) || /pets_microchip_unique/.test(m)) return new Error('That microchip number is already registered to another pet.');
  if (/violates check constraint/i.test(m)) return new Error('One of the values is out of range. Check dates, weight and phone number.');
  if (/JWT|not signed in|28000/i.test(m)) return new Error('Your session ended. Sign in again.');
  if (/Failed to fetch|NetworkError/i.test(m)) return new Error("Can't reach PetMate's server. Check your connection and try again.");
  return new Error(m);
}

/* Probe: can this page reach Supabase? (claude.ai previews block outside connections) */
async function canReachSupabase() {
  if (!window.supabase) return false;
  if (/[?&]demo\b/.test(location.search)) return false;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch(CFG.url + '/auth/v1/health', { headers: { apikey: CFG.key }, signal: ctl.signal });
    clearTimeout(t); return r.status < 500;
  } catch { return false; }
}

/* ===================== Ask-the-record answerer (only answers from saved data) ===================== */
function answerFromRecord(q, ctx) {
  const s = q.toLowerCase(), P = ctx.pet, B = ctx.bundle, n = P.name;
  const he = P.sex === 'female' ? 'she' : P.sex === 'male' ? 'he' : 'they';
  const H = P.pet_health || { allergies: [], conditions: [] };
  const vetLine = P.vet ? `${[P.vet.doctor_name, P.vet.clinic_name].filter(Boolean).join(' at ')}${P.vet.phone ? `\nPhone: ${P.vet.phone}` : ''}${P.vet.is_24x7 ? ' (24/7)' : ''}` : '';
  const vx = B.vaccines || [];
  const named = vx.find(v => s.includes(v.vaccine_name.toLowerCase().split(/[\s(]/)[0]));
  if (named) {
    const st = VAX[named.status][0].toLowerCase();
    return { text: `${n}'s ${named.vaccine_name} vaccine was given on ${fmtDate(named.given_on)}${named.due_on ? ` and is ${named.status === 'overdue' ? 'overdue since' : 'valid until'} ${fmtDate(named.due_on)}` : ''} (${st}).`, src: ['Vaccinations'] };
  }
  if (/vaccin|booster|shot|jab|due/.test(s)) {
    if (!vx.length) return { text: `There are no vaccinations in ${n}'s record yet. Scan or add a vaccination card to fill this in.`, src: [] };
    const next = vx.filter(v => v.due_on).sort((a, b) => a.due_on.localeCompare(b.due_on))[0];
    const bad = vx.filter(v => v.status !== 'valid').map(v => `${v.vaccine_name} (${VAX[v.status][0].toLowerCase()}, ${fmtDate(v.due_on)})`);
    return { text: `${next ? `Next due: ${next.vaccine_name} on ${fmtDate(next.due_on)} (in ${dayDiff(todayISO(), next.due_on)} days).` : ''}${bad.length ? `\nNeeds attention: ${bad.join(', ')}.` : '\nEverything else is up to date.'}`, src: ['Vaccinations'] };
  }
  if (/tonight|today|medic|meds|pill|dose|tablet|take/.test(s)) {
    let d = B.doses || [];
    if (/tonight|evening/.test(s)) d = d.filter(x => (x.time_of_day || '00') >= '15:00');
    if (!d.length) return { text: `No ${/tonight/.test(s) ? 'evening ' : ''}doses are scheduled for ${n} ${/tonight/.test(s) ? 'tonight' : 'today'}.`, src: ['Medication schedule'] };
    return { text: `${cap(/tonight/.test(s) ? 'tonight' : 'today')} ${n} takes:\n` + d.map(x => `• ${x.name} ${x.dose} at ${fmtTime(x.time_of_day)}${x.with_food ? ', with food' : ''}${x.given ? ' (given ✓)' : ''}`).join('\n'), src: ['Medication schedule', 'Routine'] };
  }
  if (/allerg|treat|eat|food|feed|diet/.test(s)) {
    const food = (B.tasksToday || []).filter(t => t.kind === 'food');
    return { text: `${H.allergies.length ? `${n} is allergic to ${H.allergies.join(', ').toLowerCase()}.` : `No allergies are recorded for ${n}.`}${food.length ? `\nMeals: ${food.map(f => `${fmtTime(f.time_of_day)} ${f.title}`).join('; ')}.` : ''}`, src: ['Health profile', 'Routine'] };
  }
  if (/vet|doctor|clinic|hospital/.test(s)) return vetLine ? { text: vetLine, src: ['Health profile'] } : { text: `No vet is saved for ${n} yet. Add one from the pet profile.`, src: [] };
  if (/weigh|kg|weight/.test(s)) {
    const w = (B.weights || [])[0];
    return w ? { text: `${n} weighs ${w.weight_kg} kg, last logged ${fmtDate(w.logged_on)}.`, src: ['Weight log'] } : P.weight_kg ? { text: `${n} weighs ${P.weight_kg} kg.`, src: ['Pet profile'] } : { text: `No weight is saved for ${n} yet.`, src: [] };
  }
  if (/walk|stair|exercise|hip|jump/.test(s)) {
    const w = (B.tasks || []).filter(t => t.kind === 'walk');
    const warns = [...new Set(w.map(x => x.warning).filter(Boolean))];
    if (!w.length && !H.conditions.length) return { text: `There's nothing about walks in ${n}'s record yet.`, src: [] };
    return { text: `${w.length ? `Walks: ${w.map(x => `${fmtTime(x.time_of_day)} (${x.title})`).join(', ')}.` : ''}${warns.length ? `\nKeep in mind: ${warns.join('; ').toLowerCase()}.` : ''}${H.conditions.length ? `\nConditions: ${H.conditions.join(', ')}.` : ''}`, src: ['Routine', 'Health profile'] };
  }
  if (/chip|microchip/.test(s)) return P.microchip_no ? { text: `Microchip number: ${P.microchip_no}`, src: ['Pet profile'] } : { text: `No microchip number is saved for ${n}.`, src: [] };
  if (/condition|health|sick|problem/.test(s)) return { text: H.conditions.length ? `Recorded conditions: ${H.conditions.join(', ')}.` : `No conditions are recorded for ${n}.`, src: ['Health profile'] };
  if (/old|age|birthday|born/.test(s)) return P.birth_date ? { text: `${n} was born on ${fmtDate(P.birth_date)}, so ${he}'s ${ageOf(P.birth_date)}.`, src: ['Pet profile'] } : { text: `${n}'s birthday isn't saved yet.`, src: [] };
  return { text: `I couldn't find that in ${n}'s record, so I won't guess. You can add it as a note in the profile.`, src: [] };
}

/* Email + password sign-in. Emails are only sent to confirm a new account and for "Forgot password". */
function Auth({ ctx, start }) {
  const [mode, setMode] = useState(start || 'signin'); // signin | signup | confirm | forgot | resetcode
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [code, setCode] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [info, setInfo] = useState('');
  const [wait, setWait] = useState(0);
  useEffect(() => { if (wait <= 0) return; const t = setTimeout(() => setWait(wait - 1), 1000); return () => clearTimeout(t); }, [wait]);
  const go = m => { setMode(m); setErr(''); setInfo(''); setCode(''); };
  const run = async fn => { setBusy(true); setErr(''); try { await fn(); } catch (e) { setErr(e.message); if (e.code === 'email_not_confirmed') go('confirm'); } finally { setBusy(false); } };
  const needEmail = () => { if (!EMAIL_RE.test(email.trim())) { setErr('Enter a valid email address, like name@gmail.com'); return false; } return true; };

  const signIn = () => { if (!needEmail()) return; if (!pw) { setErr('Enter your password'); return; } run(() => ctx.api.signIn(email.trim(), pw)); };
  const signUp = () => {
    if (!needEmail()) return;
    const p = pwProblem(pw); if (p) { setErr(p); return; }
    if (pw !== pw2) { setErr("The two passwords don't match"); return; }
    run(async () => {
      const r = await ctx.api.signUp(email.trim(), pw);
      if (r.exists) { go('signin'); setInfo('You already have an account. Sign in with your password, or use "Forgot password" if you never set one.'); return; }
      if (r.needsConfirm) { go('confirm'); setWait(60); setInfo('Account created. Enter the code from the confirmation email to finish.'); }
    });
  };
  const confirm = () => { if (!/^\d{6,10}$/.test(code)) { setErr('Enter the code from the email (numbers only).'); return; } run(() => ctx.api.verifySignup(email.trim(), code)); };
  const forgot = () => { if (!needEmail()) return; run(async () => { await ctx.api.sendReset(email.trim()); go('resetcode'); setWait(60); setInfo(`If ${email.trim()} has a PetMate account, a reset code is on its way.`); }); };
  const resetCode = () => { if (!/^\d{6,10}$/.test(code)) { setErr('Enter the code from the email (numbers only).'); return; } ctx.startPasswordReset(); run(async () => { try { await ctx.api.verifyReset(email.trim(), code); } catch (e) { ctx.cancelPasswordReset(); throw e; } }); };

  const titles = { signin: 'Sign in', signup: 'Create your account', confirm: 'Confirm your email', forgot: 'Reset your password', resetcode: 'Enter your reset code' };
  const back = () => ({ signin: () => ctx.go('welcome'), signup: () => ctx.go('welcome'), confirm: () => go('signup'), forgot: () => go('signin'), resetcode: () => go('forgot') })[mode]();
  const emailField = html`<${Field} id="au-email" label="Email"><${TextInput} id="au-email" type="email" autocomplete="email" inputmode="email" value=${email} onInput=${v => { setEmail(v); setErr(''); }} placeholder="you@example.com" /></${Field}>`;
  const codeField = (label) => html`<${Field} id="au-code" label=${label}><input id="au-code" class="input num" style="font-size:26px;letter-spacing:.35em;text-align:center;font-weight:800" inputmode="numeric" autocomplete="one-time-code" maxlength="10" value=${code} onInput=${e => { setCode(e.target.value.replace(/\D/g, '')); setErr(''); }} placeholder="••••••" /></${Field}>`;
  const errBox = err ? html`<div class="note red" role="alert"><${Icon} n="error" /><div>${err}</div></div>` : null;
  const infoBox = info ? html`<div class="note mint"><${Icon} n="info" /><div>${info}</div></div>` : null;
  const demoNote = ctx.api.mode === 'demo' ? html`<div class="note amber"><${Icon} n="science" /><div>Preview: this copy can't reach the database, so any email and password signs you in with sample data.</div></div>` : null;

  return html`<div class="screen">
    <${TopBar} title=${titles[mode]} onBack=${back} />
    ${demoNote}${infoBox}
    ${mode === 'signin' && html`<form class="stack" style="gap:14px" onSubmit=${e => { e.preventDefault(); signIn(); }}>
      ${emailField}
      <${Field} id="au-pw" label="Password"><${PasswordInput} id="au-pw" autocomplete="current-password" value=${pw} onInput=${v => { setPw(v); setErr(''); }} /></${Field}>
      <button type="button" class="linkbtn" style="align-self:flex-end" onClick=${() => go('forgot')}>Forgot password?</button>
      ${errBox}
      <button class="btn" id="au-signin" type="submit" disabled=${busy}><${Busy} busy=${busy}>Sign in</${Busy}></button>
      <p class="small" style="margin:0;text-align:center">New to PetMate? <button type="button" class="linkbtn" onClick=${() => go('signup')}>Create an account</button></p>
    </form>`}
    ${mode === 'signup' && html`<form class="stack" style="gap:14px" onSubmit=${e => { e.preventDefault(); signUp(); }}>
      ${emailField}
      <${Field} id="au-newpw" label="Password" hint="At least 8 characters, with letters and numbers"><${PasswordInput} id="au-newpw" autocomplete="new-password" value=${pw} onInput=${v => { setPw(v); setErr(''); }} /></${Field}>
      <${Field} id="au-newpw2" label="Repeat password"><${PasswordInput} id="au-newpw2" autocomplete="new-password" value=${pw2} onInput=${v => { setPw2(v); setErr(''); }} /></${Field}>
      ${errBox}
      <button class="btn" id="au-signup" type="submit" disabled=${busy}><${Busy} busy=${busy}>Create account</${Busy}></button>
      <p class="small" style="margin:0;text-align:center">Already registered? <button type="button" class="linkbtn" onClick=${() => go('signin')}>Sign in</button></p>
      <div class="note blue"><${Icon} n="verified_user" /><div>Caregivers never need an account. You share read-only links with them that you can revoke.</div></div>
    </form>`}
    ${mode === 'confirm' && html`<form class="stack" style="gap:14px" onSubmit=${e => { e.preventDefault(); confirm(); }}>
      <p class="lede">We sent a code to <b>${email}</b>. Use the code from the newest PetMate email.</p>
      ${codeField('Confirmation code')}${errBox}
      <button class="btn" id="au-confirm" type="submit" disabled=${busy || code.length < 6}><${Busy} busy=${busy}>Confirm email</${Busy}></button>
      <button type="button" class="btn ghost" disabled=${wait > 0 || busy} onClick=${() => run(async () => { await ctx.api.resendSignup(email.trim()); setWait(60); setInfo('A new code is on its way. Only the newest code works.'); })}>${wait > 0 ? `Send a new code in ${wait}s` : 'Send a new code'}</button>
    </form>`}
    ${mode === 'forgot' && html`<form class="stack" style="gap:14px" onSubmit=${e => { e.preventDefault(); forgot(); }}>
      <p class="lede">We'll email you a code to set a new password.</p>
      ${emailField}${errBox}
      <button class="btn" id="au-forgot" type="submit" disabled=${busy}><${Busy} busy=${busy}><${Icon} n="mail" />Email me a reset code</${Busy}></button>
      <button type="button" class="linkbtn" style="align-self:center" onClick=${() => { if (needEmail()) go('resetcode'); }}>I already have a code</button>
    </form>`}
    ${mode === 'resetcode' && html`<form class="stack" style="gap:14px" onSubmit=${e => { e.preventDefault(); resetCode(); }}>
      <p class="lede">Enter the code sent to <b>${email}</b>. Use the newest PetMate email.</p>
      ${codeField('Reset code')}${errBox}
      <button class="btn" id="au-resetcode" type="submit" disabled=${busy || code.length < 6}><${Busy} busy=${busy}>Continue</${Busy}></button>
      <button type="button" class="btn ghost" disabled=${wait > 0 || busy} onClick=${() => run(async () => { await ctx.api.sendReset(email.trim()); setWait(60); setInfo('A new code is on its way. Only the newest code works.'); })}>${wait > 0 ? `Send a new code in ${wait}s` : 'Send a new code'}</button>
    </form>`}
  </div>`;
}

function NewPassword({ ctx }) {
  const [pw, setPw] = useState(''); const [pw2, setPw2] = useState('');
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const save = async () => {
    const p = pwProblem(pw); if (p) { setErr(p); return; }
    if (pw !== pw2) { setErr("The two passwords don't match"); return; }
    setBusy(true); setErr('');
    try { await ctx.api.setPassword(pw); ctx.finishPasswordReset(); ctx.toast('New password saved'); } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  return html`<div class="screen">
    <${TopBar} title="Set a new password" />
    <p class="lede">You're signed in. Choose a new password for next time.</p>
    <form class="stack" style="gap:14px" onSubmit=${e => { e.preventDefault(); save(); }}>
      <${Field} id="np-pw" label="New password" hint="At least 8 characters, with letters and numbers"><${PasswordInput} id="np-pw" autocomplete="new-password" value=${pw} onInput=${v => { setPw(v); setErr(''); }} /></${Field}>
      <${Field} id="np-pw2" label="Repeat new password"><${PasswordInput} id="np-pw2" autocomplete="new-password" value=${pw2} onInput=${v => { setPw2(v); setErr(''); }} /></${Field}>
      ${err && html`<div class="note red" role="alert"><${Icon} n="error" /><div>${err}</div></div>`}
      <button class="btn" id="np-save" type="submit" disabled=${busy}><${Busy} busy=${busy}>Save new password</${Busy}></button>
    </form>
  </div>`;
}

/* =============================== Onboarding (3 steps → complete_onboarding RPC) =============================== */
function Onboarding({ ctx }) {
  const addingPet = !!ctx.session && ctx.pets.length > 0;
  const P = ctx.profile || {};
  const [step, setStep] = useState(addingPet ? 2 : 1);
  const [f, setF] = useState({ full_name: P.full_name || '', phone: P.phone || '', email: P.email || ctx.session?.user?.email || '', species: 'dog', pet_name: '', breed: '', birth_date: '', sex: 'unknown', is_neutered: null, weight_kg: '', allergies: '', conditions: '', vet_doctor: '', vet_clinic: '', vet_phone: '', microchip_no: '' });
  const [photo, setPhoto] = useState(null);
  const [errs, setErrs] = useState({});
  const [busy, setBusy] = useState(false);
  const set = k => v => { setF(s => ({ ...s, [k]: v })); setErrs(e => ({ ...e, [k]: null })); };
  const petName = f.pet_name.trim() || 'your pet';
  const phoneOk = v => !v.trim() || /^\+?[0-9 ()-]{6,20}$/.test(v.trim());
  const validate = s => {
    const e = {};
    if (s === 1) { if (!f.full_name.trim()) e.full_name = 'Add your name so caregivers know who to call'; if (!phoneOk(f.phone)) e.phone = 'Use digits, spaces or +, like +91 98765 43210'; }
    if (s === 2) {
      if (!f.pet_name.trim()) e.pet_name = "Your pet's name is required";
      if (f.birth_date && f.birth_date > todayISO()) e.birth_date = "Birthday can't be in the future";
      if (f.weight_kg && !(+f.weight_kg > 0 && +f.weight_kg < 200)) e.weight_kg = 'Enter a weight between 0.1 and 199 kg';
    }
    if (s === 3) {
      if (f.microchip_no && !/^\d{9,15}$/.test(f.microchip_no.replace(/\s/g, ''))) e.microchip_no = 'Microchip numbers are 9 to 15 digits';
      if (!phoneOk(f.vet_phone)) e.vet_phone = 'Use digits, spaces or +';
    }
    setErrs(e); return !Object.keys(e).length;
  };
  const next = async () => {
    if (!validate(step)) return;
    if (step < 3) { setStep(step + 1); return; }
    setBusy(true);
    try {
      const photo_path = photo ? await ctx.api.upload('pet-photos', photo.file) : null;
      const res = await ctx.api.completeOnboarding({
        full_name: f.full_name.trim(), phone: f.phone.trim(), pet_name: f.pet_name.trim(), species: f.species, breed: f.breed.trim(),
        birth_date: f.birth_date || '', sex: f.sex, is_neutered: f.is_neutered, weight_kg: f.weight_kg ? String(+f.weight_kg) : '', photo_path,
        allergies: splitList(f.allergies), conditions: splitList(f.conditions), vet_doctor: f.vet_doctor.trim(), vet_clinic: f.vet_clinic.trim(), vet_phone: f.vet_phone.trim(),
        microchip_no: f.microchip_no,
      });
      await ctx.refresh(res.pet_id);
      ctx.go('home'); ctx.toast(`${f.pet_name.trim()}'s profile is ready`);
    } catch (e) { ctx.toast(e.message, 'err'); } finally { setBusy(false); }
  };
  const back = () => step === (addingPet ? 2 : 1) ? ctx.go(ctx.session ? 'home' : 'welcome') : setStep(step - 1);
  const bars = [1, 2, 3].filter(n => !addingPet || n > 1);
  return html`<div class="screen" style="background:var(--surface);min-height:100%">
    <div class="row"><button class="iconbtn" aria-label="Back" onClick=${back}><${Icon} n="arrow_back" /></button>
      <div class="row grow" style="gap:6px">${bars.map(n => html`<div key=${n} class="progress grow" style="height:6px"><i style=${`width:${step >= n ? 100 : 0}%;background:var(--blue)`}></i></div>`)}</div>
      <span class="small num" style="font-weight:800">${bars.indexOf(step) + 1}/${bars.length}</span></div>

    ${step === 1 && html`<div class="stack" style="gap:16px">
      <h1>Hi! Let's set you up</h1><p class="lede">You're the owner. You decide what each caregiver can see.</p>
      <${Field} id="ob-name" label="Your name" error=${errs.full_name}><${TextInput} id="ob-name" autocomplete="name" value=${f.full_name} onInput=${set('full_name')} cls=${errs.full_name ? 'bad' : ''} placeholder="Priya Sharma" /></${Field}>
      <${Field} id="ob-email" label="Email" hint=${ctx.api.mode === 'live' ? 'From your sign-in. Saved automatically.' : 'Preview only'}><${TextInput} id="ob-email" type="email" value=${f.email} readonly=${ctx.api.mode === 'live'} onInput=${set('email')} placeholder="you@example.com" /></${Field}>
      <${Field} id="ob-phone" label="Mobile (for emergency alerts)" error=${errs.phone}><${TextInput} id="ob-phone" type="tel" autocomplete="tel" inputmode="tel" value=${f.phone} onInput=${set('phone')} cls=${errs.phone ? 'bad' : ''} placeholder="+91 98765 43210" /></${Field}>
      <div class="note mint"><${Icon} n="verified_user" /><div>Caregivers never get an account on your record, only read-only links you can revoke.</div></div>
    </div>`}

    ${step === 2 && html`<div class="stack" style="gap:16px">
      <h1>Who are we caring for?</h1><p class="lede">${addingPet ? 'Add another pet to your account.' : 'Create your first pet profile. You can add more pets later.'}</p>
      <label class="row" style="gap:14px;cursor:pointer" for="ob-photo">
        <div class="avatar lg">${photo ? html`<img src=${photo.url} alt="Selected pet photo" />` : html`<${Icon} n="add_a_photo" />`}</div>
        <div><b>${photo ? 'Change photo' : 'Add a photo'}</b><div class="small">Optional · JPG, PNG or HEIC, up to 10 MB</div></div>
        <input id="ob-photo" type="file" accept="image/*" class="sr" onChange=${e => { const file = e.target.files[0]; if (!file) return; if (file.size > 10485760) { ctx.toast('That photo is over 10 MB. Pick a smaller one.', 'err'); return; } setPhoto({ file, url: URL.createObjectURL(file) }); }} />
      </label>
      <div class="field"><span class="label">Species</span><div class="chips">${SPECIES.map(([v, l, i]) => html`<button key=${v} type="button" class=${`chip ${f.species === v ? 'on' : ''}`} aria-pressed=${f.species === v} onClick=${() => set('species')(v)}><${Icon} n=${i} />${l}</button>`)}</div></div>
      <${Field} id="ob-pet" label="Pet's name" error=${errs.pet_name}><${TextInput} id="ob-pet" value=${f.pet_name} onInput=${set('pet_name')} cls=${errs.pet_name ? 'bad' : ''} placeholder="Bruno" /></${Field}>
      <${Field} id="ob-breed" label="Breed"><${TextInput} id="ob-breed" value=${f.breed} onInput=${set('breed')} placeholder="Beagle, Indie, Persian…" /></${Field}>
      <div class="grid2">
        <${Field} id="ob-dob" label="Birthday" error=${errs.birth_date}><${TextInput} id="ob-dob" type="date" max=${todayISO()} value=${f.birth_date} onInput=${set('birth_date')} cls=${errs.birth_date ? 'bad' : ''} /></${Field}>
        <${Field} id="ob-weight" label="Weight (kg)" error=${errs.weight_kg}><${TextInput} id="ob-weight" type="number" inputmode="decimal" step="0.1" min="0" value=${f.weight_kg} onInput=${set('weight_kg')} cls=${errs.weight_kg ? 'bad' : ''} placeholder="12.4" /></${Field}>
      </div>
      <div class="field"><span class="label">Sex</span><div class="chips">${SEXES.map(([v, l]) => html`<button key=${v} type="button" class=${`chip ${f.sex === v ? 'on' : ''}`} aria-pressed=${f.sex === v} onClick=${() => set('sex')(v)}>${l}</button>`)}</div></div>
      <div class="row between"><span class="label">Neutered / spayed</span><div class="chips">${[[true, 'Yes'], [false, 'No'], [null, 'Not sure']].map(([v, l]) => html`<button key=${l} type="button" class=${`chip ${f.is_neutered === v ? 'on' : ''}`} aria-pressed=${f.is_neutered === v} onClick=${() => set('is_neutered')(v)}>${l}</button>`)}</div></div>
    </div>`}

    ${step === 3 && html`<div class="stack" style="gap:16px">
      <h1>${petName}'s care & health</h1><p class="lede">The essentials every caregiver should know.</p>
      <${Field} id="ob-allergies" label="Allergies" hint="Separate with commas, e.g. chicken, penicillin"><${TextInput} id="ob-allergies" cls="warn" value=${f.allergies} onInput=${set('allergies')} placeholder="Chicken" /></${Field}>
      <${Field} id="ob-cond" label="Conditions" hint="Separate with commas"><${TextInput} id="ob-cond" value=${f.conditions} onInput=${set('conditions')} placeholder="Mild hip dysplasia" /></${Field}>
      <div class="panel stack">
        <span class="label">Primary vet</span>
        <div class="grid2">
          <${Field} id="ob-vetdr" label="Doctor"><${TextInput} id="ob-vetdr" value=${f.vet_doctor} onInput=${set('vet_doctor')} placeholder="Dr. Anika Rao" /></${Field}>
          <${Field} id="ob-vetcl" label="Clinic"><${TextInput} id="ob-vetcl" value=${f.vet_clinic} onInput=${set('vet_clinic')} placeholder="Greenleaf Vet" /></${Field}>
        </div>
        <${Field} id="ob-vetph" label="Clinic phone" error=${errs.vet_phone}><${TextInput} id="ob-vetph" type="tel" inputmode="tel" value=${f.vet_phone} onInput=${set('vet_phone')} cls=${errs.vet_phone ? 'bad' : ''} placeholder="+91 11 2345 6789" /></${Field}>
      </div>
      <${Field} id="ob-chip" label="Microchip no." error=${errs.microchip_no} hint="15 digits on most chips"><${TextInput} id="ob-chip" inputmode="numeric" value=${f.microchip_no} onInput=${set('microchip_no')} cls=${errs.microchip_no ? 'bad' : ''} placeholder="985 112 004 567 213" /></${Field}>
    </div>`}

    <button class="btn" id="ob-next" disabled=${busy} onClick=${next}><${Busy} busy=${busy}>${step === 3 ? `Create ${petName}'s profile` : 'Continue'}</${Busy}></button>
  </div>`;
}

/* =============================== Home =============================== */
function Home({ ctx }) {
  const { pet, bundle: B } = ctx;
  const tasks = B.tasksToday;
  const done = tasks.filter(t => t.done).length;
  const H = pet.pet_health;
  const attention = B.vaccines.find(v => v.status !== 'valid');
  const nextVax = attention || B.vaccines.filter(v => v.due_on)[0];
  const dosesLeft = B.doses.filter(d => !d.given).length;
  const first = (ctx.profile?.full_name || '').split(' ')[0];
  return html`<div class="screen">
    <div class="row between">
      <div><div class="small" style="font-weight:800">${greeting()}${first ? `, ${first}` : ''}</div><h1>${pet.name}'s day</h1></div>
      <button class="btn danger sm" onClick=${() => ctx.go('emergency')} aria-label="Emergency help"><${Icon} n="emergency" fill />SOS</button>
    </div>
    ${ctx.pets.length > 1 && html`<div class="chips">${ctx.pets.map(p => html`<button key=${p.id} class=${`chip ${p.id === pet.id ? 'on navy' : ''}`} onClick=${() => ctx.selectPet(p.id)}>${p.name}</button>`)}</div>`}
    <button class="card row" style="text-align:left;gap:14px" onClick=${() => ctx.go('profile')}>
      <${PetAvatar} ctx=${ctx} pet=${pet} />
      <div class="grow stack tight"><h2>${pet.name}</h2>
        <div class="small">${[pet.breed, ageOf(pet.birth_date), pet.weight_kg ? `${pet.weight_kg} kg` : null].filter(Boolean).join(' · ')}</div>
        <div class="row wrap" style="gap:6px">${H.allergies.slice(0, 2).map(a => html`<span key=${a} class="tag red"><${Icon} n="block" />No ${a.toLowerCase()}</span>`)}${H.conditions.slice(0, 1).map(c => html`<span key=${c} class="tag amber">${c}</span>`)}</div>
      </div><${Icon} n="chevron_right" />
    </button>

    <div class="card stack">
      <div class="row between"><h2>Today's checklist</h2><button class="linkbtn" onClick=${() => ctx.go('routine')}>Edit routine</button></div>
      ${tasks.length ? html`
        <div class="row" style="gap:10px"><div class="progress grow"><i style=${`width:${Math.round(done / tasks.length * 100)}%`}></i></div><span class="small num" style="font-weight:800">${done} of ${tasks.length}</span></div>
        <div>${tasks.map(t => html`<${TaskRow} key=${t.id} t=${t} ctx=${ctx} />`)}</div>`
      : html`<div class="stack" style="align-items:flex-start"><p class="small" style="margin:0">No routine yet. Describe ${pet.name}'s day once and PetMate turns it into a checklist.</p><button class="btn sm" onClick=${() => ctx.go('routine')}><${Icon} n="auto_awesome" />Build routine</button></div>`}
    </div>

    <div class="grid2">
      <button class="card stack tight" style="text-align:left" onClick=${() => ctx.go('meds')}>
        <span class="kind k-med"><${Icon} n="medication" /></span><b>${dosesLeft ? `${dosesLeft} dose${dosesLeft > 1 ? 's' : ''} left` : B.doses.length ? 'All doses given' : 'No doses today'}</b><span class="small">Medications</span></button>
      <button class="card stack tight" style="text-align:left" onClick=${() => ctx.go('profile')}>
        <span class=${`kind ${attention ? 'k-sun' : 'k-walk'}`}><${Icon} n="vaccines" /></span>
        <b>${nextVax ? `${nextVax.vaccine_name.split(' (')[0]} ${nextVax.status === 'overdue' ? 'overdue' : 'due ' + fmtShort(nextVax.due_on)}` : 'No vaccines yet'}</b>
        <span class="small">${attention ? 'Needs attention' : nextVax ? 'Next vaccine' : 'Scan a card to add'}</span></button>
    </div>

    <div class="stack"><div class="row" style="gap:8px"><h2>PetMate tools</h2><span class="ai-pill"><${Icon} n="auto_awesome" />Smart</span></div>
      <div class="tools">${TOOLS.map(([k, l, s, i, c]) => html`<button key=${k} class="tool" onClick=${() => ctx.go(k)}><span class=${`kind ${c}`}><${Icon} n=${i} /></span><b>${l}</b><span>${s}</span></button>`)}</div>
    </div>
  </div>`;
}
function TaskRow({ t, ctx }) {
  const k = KINDS[t.kind] || KINDS.care;
  return html`<div class=${`task ${t.done ? 'done' : ''}`}>
    <button class=${`check ${t.done ? 'on' : ''}`} role="checkbox" aria-checked=${t.done} aria-label=${`Mark ${t.title} ${t.done ? 'not done' : 'done'}`} onClick=${() => ctx.toggleTask(t)}><${Icon} n="check" /></button>
    <div class="grow"><div class="t-title">${t.title}</div>
      <div class="t-meta"><span class="time num">${fmtTime(t.time_of_day)}</span>${t.frequency !== 'daily' ? html`<span class="tag gray">${FREQ_LABEL[t.frequency]}</span>` : null}${t.warning ? html`<span class="tag red">⚠ ${t.warning}</span>` : null}</div></div>
    <span class=${`kind k-${t.kind}`} style="width:34px;height:34px;border-radius:11px"><${Icon} n=${k.icon} style="font-size:18px" /></span>
  </div>`;
}

/* =============================== Profile & records =============================== */
function Profile({ ctx }) {
  const { pet, bundle: B } = ctx;
  const H = pet.pet_health;
  const activeMeds = B.meds.filter(m => m.is_active).length;
  const sexLabel = { male: 'Male', female: 'Female', unknown: '' }[pet.sex] + (pet.is_neutered ? (pet.sex === 'female' ? ' · spayed' : ' · neutered') : '');
  return html`<div class="screen">
    <${TopBar} title="Pet profile" right=${html`<button class="iconbtn" aria-label="Edit profile" onClick=${() => ctx.openSheet({ type: 'editPet' })}><${Icon} n="edit" /></button>`} />
    <div class="row" style="gap:16px"><${PetAvatar} ctx=${ctx} pet=${pet} lg />
      <div class="stack tight"><h1>${pet.name}</h1><div class="small">${[SPECIES.find(s => s[0] === pet.species)?.[1], pet.breed, sexLabel].filter(Boolean).join(' · ')}</div></div></div>

function ShareRow({ s, ctx }) {

    ${confirm ? html`<div class="row" style="gap:6px"><button class="btn danger sm" onClick=${() => ctx.revokeShare(s.id)}>Revoke</button><button class="btn ghost sm" onClick=${() => setConfirm(false)}>Keep</button></div>`

/* =============================== Routine Builder =============================== */
const toDraft = t => ({ id: t.id, key: t.id, time: hhmm(t.time_of_day), title: t.title, kind: t.kind, freq: t.frequency, warn: t.warning || '' });
function Routine({ ctx }) {
  const { pet, bundle: B } = ctx;
  const [draft, setDraft] = useState(() => B.tasks.map(toDraft));
  const [text, setText] = useState(B.routine?.source_text || '');
  const [open, setOpen] = useState(!B.tasks.length);
  const [stage, setStage] = useState('idle');
  const [stepN, setStepN] = useState(0);
  const [parsed, setParsed] = useState(null);
  const [addAllergy, setAddAllergy] = useState(true);
  const [busy, setBusy] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [usedText, setUsedText] = useState(false);
  const example = `${pet.name} eats twice a day, 1 cup of kibble at 7:30am and 6:30pm. Walk ${pet.sex === 'female' ? 'her' : 'him'} 30 minutes morning and evening. Brush teeth every other night.`;
  const upd = (key, patch) => { setDirty(true); setDraft(d => d.map(x => x.key === key ? { ...x, ...patch } : x)); };
  const build = () => {
    if (!text.trim()) { ctx.toast('Describe the routine first, or tap "Use example"', 'err'); return; }
    setStage('loading'); setStepN(0);
    let n = 0; const iv = setInterval(() => { n++; setStepN(n); if (n >= 4) { clearInterval(iv); const r = parseRoutine(text, pet.name); setParsed(r); setDraft(r.tasks); setStage('idle'); setOpen(false); setDirty(true); setUsedText(true); } }, 450);
  };
  const save = async () => {
    const bad = draft.find(d => !d.title.trim() || !d.time);
    if (bad) { ctx.toast('Every task needs a time and a title', 'err'); return; }
    setBusy(true);
    try {
      await ctx.api.saveRoutine(pet.id, usedText ? text.trim() : null, draft, B.tasks);
      const newAllergies = parsed?.allergies.filter(a => !pet.pet_health.allergies.map(x => x.toLowerCase()).includes(a)) || [];
      if (addAllergy && newAllergies.length) await ctx.api.updateHealth(pet.id, { allergies: [...pet.pet_health.allergies, ...newAllergies.map(cap)], conditions: pet.pet_health.conditions });
      await ctx.refresh();
      setDirty(false); setUsedText(false);
      ctx.toast('Routine saved · home checklist updated');
      ctx.openSheet({ type: 'routineSaved' });
    } catch (e) { ctx.toast(e.message, 'err'); } finally { setBusy(false); }
  };
  useEffect(() => { if (!dirty) setDraft(B.tasks.map(toDraft)); }, [B.tasks, dirty]);
  const newAllergies = parsed?.allergies.filter(a => !pet.pet_health.allergies.map(x => x.toLowerCase()).includes(a)) || [];
  const steps = ['Reading your instructions', 'Finding times & frequency', 'Spotting warnings & allergies', 'Building the checklist'];
  return html`<div class="screen">
    <${TopBar} title="Routine Builder" onBack=${() => ctx.go('home')} ai="Explain it once" />
    <div class="card stack">
      <button class="row between" style="text-align:left" aria-expanded=${open} onClick=${() => setOpen(!open)}><div><h3>Describe ${pet.name}'s day</h3><div class="small">Type or paste it the way you'd tell a friend</div></div><${Icon} n=${open ? 'expand_less' : 'expand_more'} /></button>
      ${open && html`<div class="stack">
        <textarea id="rt-text" class="textarea" rows="7" value=${text} onInput=${e => setText(e.target.value)} placeholder=${example}></textarea>
        <div class="row between"><span class="small num">${text.trim() ? text.trim().split(/\s+/).length : 0} words</span>${!text.trim() && html`<button class="linkbtn" onClick=${() => setText(example)}>Use example</button>`}</div>
        ${stage === 'loading' ? html`<div class="stack tight">${steps.map((l, i) => html`<div key=${l} class="row" style=${`opacity:${i <= stepN ? 1 : .4}`}><${Icon} n=${i < stepN ? 'check_circle' : 'radio_button_unchecked'} fill=${i < stepN} style=${`color:${i < stepN ? 'var(--mint-ink)' : 'var(--faint)'}`} /><span>${l}</span></div>`)}</div>`
          : html`<button class="btn" id="rt-build" onClick=${build}><${Icon} n="auto_awesome" />Build checklist</button>`}
        ${draft.length > 0 && html`<p class="small" style="margin:0">Building replaces the checklist below. Nothing is saved until you tap Save.</p>`}
      </div>`}
    </div>

    ${parsed && html`<div class="stack">
      <div class="note mint"><${Icon} n="task_alt" /><div>Found ${parsed.tasks.length} tasks${parsed.warnings.length ? `, ${parsed.warnings.length} warnings` : ''}${parsed.notes.length ? ` and ${parsed.notes.length} notes` : ''}. Tap anything to edit.</div></div>
      ${parsed.warnings.map(w => html`<div key=${w} class="note red"><${Icon} n="warning" /><div>${w}</div></div>`)}
      ${parsed.notes.map(w => html`<div key=${w} class="note blue"><${Icon} n="info" /><div>Note for caregivers: ${w}</div></div>`)}
      ${newAllergies.length > 0 && html`<div class="row between panel"><span>Add <b>${newAllergies.join(', ')}</b> to ${pet.name}'s allergies</span><${Switch} on=${addAllergy} label="Add allergies to health profile" onToggle=${() => setAddAllergy(!addAllergy)} /></div>`}
    </div>`}

    <div class="stack">
      <div class="row between"><h2>Checklist <span class="small num">(${draft.length})</span></h2><button class="btn ghost sm" onClick=${() => { setDirty(true); setDraft(d => [...d, { key: uid(), time: '12:00', title: '', kind: 'care', freq: 'daily', warn: '' }]); }}><${Icon} n="add" />Add task</button></div>
      ${draft.length ? draft.map(d => html`<div key=${d.key} class="etask">
        <button class=${`kind k-${d.kind}`} aria-label=${`Type: ${KINDS[d.kind].label}. Tap to change`} title="Change type" onClick=${() => { const ks = Object.keys(KINDS); upd(d.key, { kind: ks[(ks.indexOf(d.kind) + 1) % ks.length] }); }}><${Icon} n=${KINDS[d.kind].icon} /></button>
        <div class="grow">
          <input class="input" aria-label="Task title" value=${d.title} placeholder="What needs doing?" onInput=${e => upd(d.key, { title: e.target.value })} />
          <div class="etask-meta">
            <input class="input mini num" type="time" aria-label="Time" value=${d.time} onInput=${e => upd(d.key, { time: e.target.value })} />
            <select class="select mini" aria-label="How often" value=${d.freq} onChange=${e => upd(d.key, { freq: e.target.value })}>${FREQ.map(([v, l]) => html`<option key=${v} value=${v}>${l}</option>`)}</select>
            <input class="input mini" style="flex:1;min-width:120px" aria-label="Warning" value=${d.warn} placeholder="⚠ Warning (optional)" onInput=${e => upd(d.key, { warn: e.target.value })} />
          </div>
        </div>
        <button class="iconbtn" style="width:36px;height:36px" aria-label=${`Delete ${d.title || 'task'}`} onClick=${() => { setDirty(true); setDraft(ds => ds.filter(x => x.key !== d.key)); }}><${Icon} n="delete" /></button>
      </div>`) : html`<p class="small" style="margin:0">No tasks yet. Describe the day above or add tasks one by one.</p>`}
    </div>
    <div class="row" style="gap:10px;position:sticky;bottom:0;padding-block:8px;background:var(--bg)">
      ${B.tasks.length > 0 && html`<button class="btn ghost" style="flex:1" onClick=${() => ctx.openSheet({ type: 'routineSaved' })}><${Icon} n="link" />Care link</button>`}
      <button class="btn" id="rt-save" style="flex:2" disabled=${busy || !dirty} onClick=${save}><${Busy} busy=${busy}>${dirty ? 'Save routine' : 'Saved'}</${Busy}></button>
    </div>
  </div>`;
}

/* =============================== Care Handoff =============================== */
function previewShare(role, ctx) {
  const { pet: P, bundle: B, profile: O } = ctx; const H = P.pet_health;
  const tasks = B.tasksToday.map(({ time_of_day, title, kind, frequency, warning }) => ({ time_of_day, title, kind, frequency, warning }));
  const meds = B.meds.filter(m => m.is_active);
  const base = { role, pet: { name: P.name, species: P.species, breed: P.breed }, allergies: H.allergies };
  const vt = P.vet;
  switch (role) {
    case 'sitter': return { ...base, tasks, medications: meds.map(m => ({ name: m.name, dose: m.dose, instructions: m.instructions, with_food: m.with_food })), vet: vt ? { doctor: vt.doctor_name, clinic: vt.clinic_name, phone: vt.phone, is_24x7: vt.is_24x7 } : null, owner_phone: O?.phone };
    case 'kennel': return { ...base, conditions: H.conditions, vaccinations: B.vaccines.map(v => ({ vaccine: v.vaccine_name, given_on: v.given_on, due_on: v.due_on })), feeding_and_meds: tasks.filter(t => ['food', 'med'].includes(t.kind)) };
    case 'vet': return { ...base, patient: { birth_date: P.birth_date, sex: P.sex, is_neutered: P.is_neutered, weight_kg: P.weight_kg, microchip_no: P.microchip_no }, conditions: H.conditions, medications: meds.map(m => ({ name: m.name, dose: m.dose, instructions: m.instructions })), vaccinations: B.vaccines.map(v => ({ vaccine: v.vaccine_name, given_on: v.given_on, due_on: v.due_on, batch_no: v.batch_no })), recent_symptoms: (B.symptoms || []).map(s => ({ on: s.created_at, symptoms: s.symptoms, description: s.description, urgency: s.urgency })) };
    case 'walker': return { ...base, walks: tasks.filter(t => t.kind === 'walk'), owner: { name: O?.full_name, phone: O?.phone } };
    default: return { ...base, tasks };
  }
}
function ShareCard({ data }) {
  if (data.error) return html`<div class="note red"><${Icon} n="link_off" /><div>${data.error}</div></div>`;
  const sec = (title, tone, items) => items && items.length ? html`<div class="stack tight"><div class="eyebrow" style=${`color:var(--${tone})`}>${title}</div>${items.map((it, i) => html`<div key=${i} class="row" style="align-items:flex-start;gap:8px"><span style=${`width:6px;height:6px;border-radius:50%;background:var(--${tone});margin-top:8px;flex:none`}></span><span>${it}</span></div>`)}</div>` : null;
  const taskLine = t => `${fmtTime(t.time_of_day)} · ${t.title}${t.frequency !== 'daily' ? ` (${FREQ_LABEL[t.frequency].toLowerCase()})` : ''}${t.warning ? ` — ${t.warning}` : ''}`;
  const allergy = data.allergies?.length ? [`Allergic to ${data.allergies.join(', ').toLowerCase()}`] : [];
  const d = data;
  return html`<div class="stack" style="gap:14px">
    ${d.role === 'routine' || d.role === 'sitter' ? sec("Today's routine", 'blue', (d.tasks || []).map(taskLine)) : null}
    ${d.role === 'sitter' ? html`${sec('Must know', 'red', [...allergy, ...(d.medications || []).map(m => `${m.name} ${m.dose}${m.with_food ? ', with food' : ''}${m.instructions ? ` — ${m.instructions}` : ''}`)])}${sec('If something is wrong', 'mint-ink', [d.vet ? `${[d.vet.doctor, d.vet.clinic].filter(Boolean).join(', ')}${d.vet.phone ? ` · ${d.vet.phone}` : ''}${d.vet.is_24x7 ? ' (24/7)' : ''}` : null, d.owner_phone ? `Owner · ${d.owner_phone}` : null].filter(Boolean))}` : null}
    ${d.role === 'kennel' ? html`${sec('Vaccination proof', 'mint-ink', (d.vaccinations || []).map(v => `${vaxStatus(v.due_on) === 'overdue' ? '✗' : '✓'} ${v.vaccine} · ${v.due_on ? `valid to ${fmtDate(v.due_on)}` : `given ${fmtDate(v.given_on)}`}`))}${sec('Feeding & meds', 'blue', (d.feeding_and_meds || []).map(taskLine))}${sec('Health', 'red', [...allergy, ...(d.conditions || [])])}` : null}
    ${d.role === 'vet' ? html`${sec('Patient', 'blue', [`${cap(d.pet.species)}${d.pet.breed ? ` · ${d.pet.breed}` : ''} · ${cap(d.patient.sex)}${d.patient.is_neutered ? ' (neutered)' : ''}${d.patient.birth_date ? ` · ${ageOf(d.patient.birth_date)}` : ''}${d.patient.weight_kg ? ` · ${d.patient.weight_kg} kg` : ''}`, d.patient.microchip_no ? `Microchip ${d.patient.microchip_no}` : null].filter(Boolean))}${sec('Current medication', 'violet', (d.medications || []).map(m => `${m.name} ${m.dose}${m.instructions ? ` — ${m.instructions}` : ''}`))}${sec('History & allergies', 'red', [...allergy, ...(d.conditions || []), ...(d.recent_symptoms || []).map(s => `${fmtDate(String(s.on).slice(0, 10))}: ${[...(s.symptoms || []), s.description].filter(Boolean).join(', ')}`)])}${sec('Vaccinations', 'mint-ink', (d.vaccinations || []).map(v => `${v.vaccine} · given ${fmtDate(v.given_on)}${v.batch_no ? ` · batch ${v.batch_no}` : ''}`))}` : null}
    ${d.role === 'walker' ? html`${sec('Walks', 'mint-ink', (d.walks || []).map(taskLine))}${sec('Treats', 'red', allergy.length ? [`${allergy[0]}: check every treat`] : ['No allergies recorded'])}${sec('Contact', 'blue', [d.owner?.name && d.owner?.phone ? `${d.owner.name} · ${d.owner.phone}` : d.owner?.phone].filter(Boolean))}` : null}
  </div>`;
}
function Handoff({ ctx }) {
  const { pet } = ctx;
  const [role, setRole] = useState('sitter');
  const [exp, setExp] = useState('7 days');
  const [busy, setBusy] = useState(false);
  const data = useMemo(() => previewShare(role, ctx), [role, ctx.bundle, ctx.pet]);
  const create = async () => {
    setBusy(true);
    try {
      const days = EXPIRIES.find(e => e[0] === exp)[1];
      const expiresAt = days ? new Date(Date.now() + days * 864e5).toISOString() : null;
      const token = await ctx.api.createShare(pet.id, role, expiresAt);
      await ctx.refresh();
      ctx.openSheet({ type: 'link', title: `${ROLES[role].label} link ready`, sub: `Read-only · ${days ? `expires in ${exp}` : 'until you revoke it'}`, token });
    } catch (e) { ctx.toast(e.message, 'err'); } finally { setBusy(false); }
  };
  return html`<div class="screen">
    <${TopBar} title="Care Handoff" onBack=${() => ctx.go('home')} ai="Right info" />
    <h2>Who's looking after ${pet.name}?</h2>
    <div class="chips">${Object.entries(ROLES).map(([k, r]) => html`<button key=${k} class=${`chip ${role === k ? 'on navy' : ''}`} aria-pressed=${role === k} onClick=${() => setRole(k)}><${Icon} n=${r.icon} />${r.short}</button>`)}</div>
    <div class="card stack" style="padding:0;overflow:hidden">
      <div class="handoff-head"><img src=${LOGO.icon} alt="" width="40" height="40" /><div class="grow"><h3 style="color:inherit">${pet.name} · for your ${ROLES[role].label.toLowerCase()}</h3><div class="small" style="color:inherit;opacity:.75">Read-only · updates when you edit the record</div></div><span class="tag" style="background:rgba(255,255,255,.16);color:#fff">Preview</span></div>
      <div class="stack" style="padding:0 16px 16px">
      <${ShareCard} data=${data} />
      <div class="note blue"><${Icon} n="visibility_off" /><div>Hidden for this role: ${ROLES[role].hidden}</div></div>
      </div>
    </div>
    <div class="field"><span class="label">Link expires</span><div class="chips">${EXPIRIES.map(([l]) => html`<button key=${l} class=${`chip ${exp === l ? 'on' : ''}`} aria-pressed=${exp === l} onClick=${() => setExp(l)}>${l}</button>`)}</div></div>
    <button class="btn" id="ho-create" disabled=${busy} onClick=${create}><${Busy} busy=${busy}><${Icon} n="send" />Create link for ${ROLES[role].label.toLowerCase()}</${Busy}></button>
    ${ctx.bundle.shares.length > 0 && html`<div class="stack"><h2>Active links</h2><div class="card">${ctx.bundle.shares.map(s => html`<${ShareRow} key=${s.id} s=${s} ctx=${ctx} />`)}</div></div>`}
  </div>`;
}

/* =============================== Medications =============================== */
function Meds({ ctx }) {
  const { pet, bundle: B } = ctx;
  const [stopping, setStopping] = useState(null);
  const left = B.doses.filter(d => !d.given).length;
  const active = B.meds.filter(m => m.is_active), past = B.meds.filter(m => !m.is_active);
  const schedText = m => (m.medication_schedules || []).map(s => {
    const lt = B.tasks.find(t => t.id === s.linked_task_id);
    return `${lt ? `with ${lt.title.split(' ·')[0].toLowerCase()}` : s.time_of_day ? fmtTime(s.time_of_day) : ''}${s.frequency !== 'daily' ? ` (${FREQ_LABEL[s.frequency].toLowerCase()})` : ''}`;
  }).filter(Boolean).join(', ');
  return html`<div class="screen">
    <div class="row between"><div><h1>Medications</h1><div class="small">${B.doses.length ? (left ? `${left} dose${left > 1 ? 's' : ''} left today` : 'All doses given today') : 'No doses scheduled today'}</div></div>
      <button class="btn sm" id="med-add" onClick=${() => ctx.openSheet({ type: 'med' })}><${Icon} n="add" />Add</button></div>
    ${B.doses.length > 0 && html`<div class="stack"><span class="eyebrow">Today</span>
      ${B.doses.map(d => html`<div key=${d.schedule_id} class="card row" style=${`gap:12px;${d.given ? 'opacity:.7' : ''}`}>
        <div class="stack tight" style="min-width:64px"><b class="num" style="font-size:15px">${fmtTime(d.time_of_day)}</b></div>
