        <div class="grow"><div class="v">${m.name} <span class="small">· ${m.dose}</span></div><div class="small">${schedText(m) || 'No schedule'}${m.end_date ? ` · until ${fmtShort(m.end_date)}` : ''}</div>
          <div class="row wrap" style="gap:6px;margin-top:4px">${m.with_food ? html`<span class="tag blue">With food</span>` : null}${isNsaid(m.name) ? html`<span class="tag amber">NSAID</span>` : null}</div></div>
        ${stopping === m.id ? html`<div class="stack tight"><button class="btn danger sm" onClick=${async () => { setStopping(null); await ctx.run(() => ctx.api.stopMedication(m.id), `${m.name} stopped`); }}>Stop</button><button class="btn ghost sm" onClick=${() => setStopping(null)}>Keep</button></div>` : html`<button class="btn ghost sm" onClick=${() => setStopping(m.id)}>Stop</button>`}
      </div>`)}</div>` : html`<p class="small" style="margin:0">No medications yet. Paste a prescription label and PetMate sets up the reminders.</p>`}
    </div>
    ${past.length > 0 && html`<details class="stack"><summary class="small" style="font-weight:800;cursor:pointer">Past medications (${past.length})</summary><div class="card" style="margin-top:8px">${past.map(m => html`<div key=${m.id} class="kv"><div class="grow"><div class="v">${m.name} · ${m.dose}</div><div class="small">${m.start_date ? fmtShort(m.start_date) : ''} – ${m.end_date ? fmtShort(m.end_date) : ''}</div></div></div>`)}</div></details>`}
  </div>`;
}
function MedSheet({ ctx, docId, initialText }) {
  const { pet, bundle: B } = ctx;
  const foodTasks = B.tasks.filter(t => t.kind === 'food');
  const [stage, setStage] = useState('paste');
  const [text, setText] = useState(initialText || '');
  const [f, setF] = useState({ name: '', dose: '', instructions: '', with_food: false, start: todayISO(), end: '', freq: 'daily', link: true, links: [], times: ['08:00'] });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const fill = parsed => {
    const p = parsed || { name: '', dose: '', perDay: 1, freq: 'daily', withFood: false, start: todayISO(), end: '', instructions: '' };
    const links = p.withFood && foodTasks.length ? (p.perDay >= 2 ? foodTasks.slice(0, Math.min(p.perDay, foodTasks.length)) : foodTasks.slice(0, 1)).map(t => t.id) : [];
    const times = p.perDay === 3 ? ['08:00', '14:00', '20:00'] : p.perDay === 2 ? ['08:00', '20:00'] : ['09:00'];
    setF({ name: p.name, dose: p.dose, instructions: p.instructions, with_food: p.withFood, start: p.start, end: p.end, freq: p.freq, link: links.length > 0, links, times });
    setStage('form');
  };
  const clash = f.name && isNsaid(f.name) ? B.meds.filter(m => m.is_active && isNsaid(m.name) && m.name.toLowerCase() !== f.name.toLowerCase()) : [];
  const save = async () => {
    if (!f.name.trim() || !f.dose.trim()) { setErr('Add the medicine name and dose'); return; }
    if (f.end && f.end < f.start) { setErr('The end date is before the start date'); return; }
    const schedules = f.freq === 'as_needed' ? [{ frequency: 'as_needed', note: 'As needed' }]
      : f.link && f.links.length ? f.links.map(id => ({ linked_task_id: id, frequency: f.freq, note: `With ${foodTasks.find(t => t.id === id)?.title.split(' ·')[0].toLowerCase()}` }))
      : f.times.filter(Boolean).map(t => ({ time_of_day: t, frequency: f.freq }));
    if (!schedules.length) { setErr('Pick at least one time or meal'); return; }
    setBusy(true);
    try {
      await ctx.api.addMedication(pet.id, { name: f.name.trim(), dose: f.dose.trim(), instructions: f.instructions.trim() || null, with_food: f.with_food, start_date: f.start || null, end_date: f.end || null, prescribed_by: pet.primary_vet_id || null, source_document_id: docId || null }, schedules);
      if (docId) await ctx.api.confirmDocument(docId, { medicine: f.name, dose: f.dose, instructions: f.instructions, start: f.start, end: f.end });
      await ctx.refresh(); ctx.closeSheet(); ctx.go('meds');
      ctx.toast(`${f.name} added · ${schedules.length} reminder${schedules.length > 1 ? 's' : ''} a day`);
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  if (stage === 'paste') return html`<div class="stack">
    <h2>Add medication</h2><p class="lede">Paste the prescription label or the vet's note. PetMate fills in the schedule; you check it.</p>
    <textarea id="med-text" class="textarea" rows="5" value=${text} onInput=${e => setText(e.target.value)} placeholder="Metacam oral suspension 1.5 mg/ml. Give 0.8 ml by mouth once daily with food for 7 days. Start 26 Sep."></textarea>
    <button class="btn" id="med-extract" disabled=${!text.trim()} onClick=${() => fill(parsePrescription(text, pet.name))}><${Icon} n="auto_awesome" />Fill in from label</button>
    <button class="btn ghost" onClick=${() => fill(null)}>Enter details by hand</button>
  </div>`;
  return html`<div class="stack">
    <div class="row between"><h2>Check the details</h2><button class="linkbtn" onClick=${() => setStage('paste')}>Back</button></div>
    <div class="grid2">
      <${Field} id="md-name" label="Medicine"><${TextInput} id="md-name" value=${f.name} onInput=${v => set('name', v)} placeholder="Metacam" /></${Field}>
      <${Field} id="md-dose" label="Dose"><${TextInput} id="md-dose" value=${f.dose} onInput=${v => set('dose', v)} placeholder="0.8 ml" /></${Field}>
    </div>
    <${Field} id="md-instr" label="Instructions"><${TextInput} id="md-instr" value=${f.instructions} onInput=${v => set('instructions', v)} placeholder="By mouth, once daily" /></${Field}>
    <div class="row between panel"><span class="label">Give with food</span><${Switch} on=${f.with_food} label="Give with food" onToggle=${() => set('with_food', !f.with_food)} /></div>
    <div class="grid2">
      <${Field} id="md-start" label="Start"><${TextInput} id="md-start" type="date" value=${f.start} onInput=${v => set('start', v)} /></${Field}>
      <${Field} id="md-end" label="End (optional)"><${TextInput} id="md-end" type="date" min=${f.start} value=${f.end} onInput=${v => set('end', v)} /></${Field}>
    </div>
    <${Field} id="md-freq" label="How often"><select id="md-freq" class="select" value=${f.freq} onChange=${e => set('freq', e.target.value)}>${FREQ.map(([v, l]) => html`<option key=${v} value=${v}>${l}</option>`)}</select></${Field}>
    ${f.freq !== 'as_needed' && html`<div class="stack">
      ${foodTasks.length > 0 && html`<div class="row between"><span class="label">Link to meal times</span><${Switch} on=${f.link} label="Link to meal times" onToggle=${() => set('link', !f.link)} /></div>`}
      ${f.link && foodTasks.length ? html`<div class="chips">${foodTasks.map(t => { const on = f.links.includes(t.id); return html`<button key=${t.id} class=${`chip ${on ? 'on' : ''}`} aria-pressed=${on} onClick=${() => set('links', on ? f.links.filter(x => x !== t.id) : [...f.links, t.id])}>${fmtTime(t.time_of_day)} · ${t.title.split(' ·')[0]}</button>`; })}</div>`
        : html`<div class="stack tight"><span class="label">Times</span><div class="row wrap" style="gap:8px">${f.times.map((t, i) => html`<div key=${i} class="row" style="gap:4px"><input class="input num" style="width:130px" type="time" aria-label=${`Dose time ${i + 1}`} value=${t} onInput=${e => set('times', f.times.map((x, j) => j === i ? e.target.value : x))} />${f.times.length > 1 && html`<button class="iconbtn" aria-label="Remove time" onClick=${() => set('times', f.times.filter((_, j) => j !== i))}><${Icon} n="close" /></button>`}</div>`)}<button class="btn ghost sm" onClick=${() => set('times', [...f.times, '20:00'])}><${Icon} n="add" />Time</button></div></div>`}
    </div>`}
    ${clash.length > 0 && html`<div class="note amber"><${Icon} n="warning" /><div><b>${f.name}</b> and <b>${clash.map(m => m.name).join(', ')}</b> are both NSAID pain relievers. Giving two together can cause stomach and kidney problems. Check with ${pet.vet?.doctor_name || 'your vet'} before starting.</div></div>`}
    ${err && html`<div class="note red" role="alert"><${Icon} n="error" /><div>${err}</div></div>`}
    <button class="btn" id="md-save" disabled=${busy} onClick=${save}><${Busy} busy=${busy}>Save & set reminders</${Busy}></button>
  </div>`;
}

/* =============================== Ask the record =============================== */
function Ask({ ctx }) {
  const { pet, bundle: B } = ctx;
  const [input, setInput] = useState('');
  const [pending, setPending] = useState(null);
  const endRef = useRef();
  const msgs = [{ id: 'hello', role: 'assistant', content: `Hi! Ask me anything about ${pet.name}. I only answer from what's saved in the record.`, sources: [] }, ...B.chat, ...(pending ? pending : [])];
  useEffect(() => { endRef.current?.scrollIntoView({ block: 'end', behavior: 'smooth' }); }, [msgs.length]);
  const ask = async q => {
    q = (q || '').trim(); if (!q || pending) return;
    setInput(''); setPending([{ id: 'q', role: 'user', content: q, sources: [] }, { id: 'typing', role: 'assistant', typing: true, content: '' }]);
    const a = answerFromRecord(q, ctx);
    await new Promise(r => setTimeout(r, 600));
    try { await ctx.api.addChat(pet.id, 'user', q, []); await ctx.api.addChat(pet.id, 'assistant', a.text, a.src); await ctx.refresh(); }
    catch (e) { ctx.toast(e.message, 'err'); }
    setPending(null);
  };
  const he = pet.sex === 'female' ? 'she' : pet.sex === 'male' ? 'he' : 'they';
  const sugg = [`Has ${pet.name} had the rabies vaccine?`, `What medication does ${he} take tonight?`, `What is ${pet.name} allergic to?`, 'When is the next vaccine due?', `Can ${he} use stairs?`];
  return html`<div style="display:flex;flex-direction:column;min-height:100%">
    <div class="screen" style="flex:1">
      <div class="topbar"><button class="iconbtn" aria-label="Back" onClick=${() => ctx.go('home')}><${Icon} n="arrow_back" /></button><img class="app-icon" src=${LOGO.icon} alt="" width="44" height="44" /><h2>Ask ${pet.name}'s record</h2></div>
      <div class="row"><span class="tag mint"><${Icon} n="lock" />Answers only from saved records</span></div>
      <div class="chat" aria-live="polite">${msgs.map(m => m.role === 'user' ? html`<div key=${m.id} class="bubble me">${m.content}</div>`
        : html`<div key=${m.id} class="bubble ai">${m.typing ? html`<span class="spinner" style="width:18px;height:18px;display:inline-block"></span>` : m.content}${m.sources?.length ? html`<div class="srcs">${m.sources.map(s => html`<span key=${s} class="tag blue"><${Icon} n="description" />${s}</span>`)}</div>` : null}</div>`)}</div>
      <div class="chips">${sugg.map(q => html`<button key=${q} class="chip" style="min-height:36px;font-size:13px" onClick=${() => ask(q)}>${q}</button>`)}</div>
      <div ref=${endRef}></div>
    </div>
    <form class="composer" style="position:sticky;bottom:0" onSubmit=${e => { e.preventDefault(); ask(input); }}>
      <label for="ask-in" class="sr">Your question</label>
      <input id="ask-in" class="input" value=${input} onInput=${e => setInput(e.target.value)} placeholder="Ask about vaccines, meds, routine…" autocomplete="off" />
      <button class="sendbtn" type="submit" aria-label="Send" disabled=${!input.trim() || !!pending}><${Icon} n="arrow_upward" /></button>
    </form>
  </div>`;
}

/* =============================== Document scanner =============================== */
function Scan({ ctx }) {
  const { pet } = ctx;
  const [type, setType] = useState('vaccination_card');
  const [file, setFile] = useState(null);
  const [stage, setStage] = useState('capture');
  const [docId, setDocId] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [f, setF] = useState({ vaccine: '', given: todayISO(), due: addDays(todayISO(), 365), vet: pet.vet ? [pet.vet.doctor_name, pet.vet.clinic_name].filter(Boolean).join(', ') : '', batch: '', notes: '', remind: true, visit: todayISO(), reason: '', weight: '', label: '' });
  const set = k => v => setF(s => ({ ...s, [k]: v }));
  const upload = async () => {
    if (!file) { setErr('Add a photo or PDF of the document first'); return; }
    setBusy(true); setErr('');
    try { const path = await ctx.api.upload('pet-documents', file.file, pet.id); const id = await ctx.api.addDocument(pet.id, type, path); setDocId(id); setStage('review'); await ctx.refresh(); }
    catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const save = async () => {
    setErr('');
    try {
      if (type === 'vaccination_card') {
        if (!f.vaccine.trim() || !f.given) { setErr('Add the vaccine name and the date it was given'); return; }
        if (f.due && f.due < f.given) { setErr('The next due date is before the date given'); return; }
        setBusy(true);
        const vetMatches = pet.vet && f.vet.trim() === [pet.vet.doctor_name, pet.vet.clinic_name].filter(Boolean).join(', ');
        await ctx.api.addVaccination({ pet_id: pet.id, vaccine_name: f.vaccine.trim(), given_on: f.given, due_on: f.due || null, vet_id: vetMatches ? pet.vet.id : null, vet_text: vetMatches ? null : f.vet.trim() || null, batch_no: f.batch.trim() || null, notes: f.notes.trim() || null, document_id: docId, reminder_enabled: f.remind });
        await ctx.api.confirmDocument(docId, { vaccine: f.vaccine, given: f.given, due: f.due, vet: f.vet, batch: f.batch, notes: f.notes });
        await ctx.refresh(); ctx.go('profile');
        ctx.toast(f.remind && f.due ? `Saved · reminder set for ${fmtDate(addDays(f.due, -14))}` : 'Saved to record');
      } else {
        if (!f.visit) { setErr('Add the visit date'); return; }
        if (f.weight && !(+f.weight > 0 && +f.weight < 200)) { setErr('Weight should be between 0.1 and 199 kg'); return; }
        setBusy(true);
        await ctx.api.confirmDocument(docId, { visit_date: f.visit, reason: f.reason, weight_kg: f.weight || null, notes: f.notes });
        if (f.weight) await ctx.api.addWeight(pet.id, +f.weight, f.visit);
        await ctx.refresh(); ctx.go('profile'); ctx.toast('Vet record saved');
      }
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const label = DOC_TYPES.find(d => d[0] === type)[1];
  return html`<div class="screen">
    <${TopBar} title="Document Scanner" onBack=${() => ctx.go('home')} />
    ${stage === 'capture' ? html`
      <div class="chips">${DOC_TYPES.map(([v, l, i]) => html`<button key=${v} class=${`chip ${type === v ? 'on violet' : ''}`} aria-pressed=${type === v} onClick=${() => setType(v)}><${Icon} n=${i} />${l}</button>`)}</div>
      <label class="drop" for="sc-file" style="cursor:pointer">
        ${file ? (file.file.type.startsWith('image/') ? html`<img src=${file.url} alt=${`Selected ${label}`} />` : html`<${Icon} n="picture_as_pdf" style="font-size:48px" />`) : html`<${Icon} n="add_a_photo" style="font-size:44px" />`}
        <b style="color:var(--ink)">${file ? file.file.name : `Add a photo or PDF of the ${label.toLowerCase()}`}</b>
        <span class="small">Fit the whole document in the frame · up to 15 MB</span>
        <input id="sc-file" type="file" accept="image/*,application/pdf" class="sr" onChange=${e => { const x = e.target.files[0]; if (!x) return; if (x.size > 15728640) { setErr('That file is over 15 MB.'); return; } setErr(''); setFile({ file: x, url: URL.createObjectURL(x) }); }} />
      </label>
      ${err && html`<div class="note red" role="alert"><${Icon} n="error" /><div>${err}</div></div>`}
      <button class="btn" id="sc-upload" disabled=${busy || !file} onClick=${type === 'prescription' ? async () => { setBusy(true); try { const path = await ctx.api.upload('pet-documents', file.file, pet.id); const id = await ctx.api.addDocument(pet.id, type, path); await ctx.refresh(); ctx.go('meds'); ctx.openSheet({ type: 'med', docId: id }); } catch (e) { setErr(e.message); } finally { setBusy(false); } } : upload}>
        <${Busy} busy=${busy}><${Icon} n="upload" />Save to ${pet.name}'s documents</${Busy}></button>
      <div class="note blue"><${Icon} n="info" /><div>Automatic reading is coming. For now you type the key details next to the photo, and PetMate sets the reminders.</div></div>
    ` : html`
      <div class="row" style="gap:12px;align-items:flex-start">
        ${file?.file.type.startsWith('image/') && html`<img src=${file.url} alt=${`Your ${label}`} style="width:96px;border-radius:12px;flex:none" />`}
        <div class="stack tight"><h2>${label} saved</h2><p class="small" style="margin:0">Now add what it says. These details go into ${pet.name}'s record.</p></div>
      </div>
      ${type === 'vaccination_card' ? html`<div class="stack">
        <${Field} id="sc-vax" label="Vaccine"><${TextInput} id="sc-vax" value=${f.vaccine} onInput=${set('vaccine')} placeholder="Leptospirosis (L4)" /></${Field}>
        <div class="grid2"><${Field} id="sc-given" label="Given on"><${TextInput} id="sc-given" type="date" max=${todayISO()} value=${f.given} onInput=${set('given')} /></${Field}><${Field} id="sc-due" label="Next due"><${TextInput} id="sc-due" type="date" min=${f.given} value=${f.due} onInput=${set('due')} /></${Field}></div>
        <${Field} id="sc-vet" label="Vet"><${TextInput} id="sc-vet" value=${f.vet} onInput=${set('vet')} /></${Field}>
        <${Field} id="sc-batch" label="Batch no." hint="Check letters vs numbers: O or 0, I or 1"><${TextInput} id="sc-batch" value=${f.batch} onInput=${set('batch')} placeholder="LP-40921" /></${Field}>
        <${Field} id="sc-notes" label="Notes"><${TextInput} id="sc-notes" value=${f.notes} onInput=${set('notes')} placeholder="Mild soreness for 24 h" /></${Field}>
        <div class="row between panel"><span><b>Remind me 2 weeks before due</b></span><${Switch} on=${f.remind} label="Reminder before due date" onToggle=${() => set('remind')(!f.remind)} /></div>
      </div>` : html`<div class="stack">
        <div class="grid2"><${Field} id="sc-visit" label="Visit date"><${TextInput} id="sc-visit" type="date" max=${todayISO()} value=${f.visit} onInput=${set('visit')} /></${Field}><${Field} id="sc-w" label="Weight (kg)"><${TextInput} id="sc-w" type="number" step="0.1" inputmode="decimal" value=${f.weight} onInput=${set('weight')} /></${Field}></div>
        <${Field} id="sc-reason" label="Reason for visit"><${TextInput} id="sc-reason" value=${f.reason} onInput=${set('reason')} placeholder="Annual check-up" /></${Field}>
        <${Field} id="sc-vnotes" label="Vet's notes"><textarea id="sc-vnotes" class="textarea" rows="3" value=${f.notes} onInput=${e => set('notes')(e.target.value)}></textarea></${Field}>
      </div>`}
      ${err && html`<div class="note red" role="alert"><${Icon} n="error" /><div>${err}</div></div>`}
      <button class="btn" id="sc-save" disabled=${busy} onClick=${save}><${Busy} busy=${busy}>Save to ${pet.name}'s record</${Busy}></button>
    `}
  </div>`;
}

/* =============================== Emergency =============================== */
function Emergency({ ctx }) {
  const { pet, bundle: B } = ctx;

  const vet = pet.vet;
  const L = LEVELS[lvlKey];
  const nsaids = B.meds.filter(m => m.is_active && isNsaid(m.name));
  const gi = chips.some(c => ['Vomiting', 'Diarrhoea', 'Not eating'].includes(c)) || /vomit|threw up|diarrh|not eating/i.test(text);
  const recordNote = gi && nsaids.length ? `${pet.name} takes ${nsaids.map(m => m.name).join(' and ')}, which can upset the stomach. Mention it to the vet, and ask before giving the next dose.` : '';
  const allergyNote = pet.pet_health.allergies.some(a => text.toLowerCase().includes(a.toLowerCase())) ? `${pet.name}'s record lists an allergy to ${pet.pet_health.allergies.join(', ').toLowerCase()}. Tell the vet what was eaten and when.` : '';
  const assess = async () => {
    if (!chips.length && !text.trim()) { ctx.toast('Pick a symptom or describe what happened', 'err'); return; }
    const k = urgencyOf(chips, text); setLvlKey(k); setStage('loading');
    try {
      const photo_path = photo ? await ctx.api.upload('symptom-photos', photo.file, pet.id) : null;
      await ctx.api.addSymptomCheck({ pet_id: pet.id, symptoms: chips, description: text.trim() || null, photo_path, urgency: k });
      await ctx.refresh();
    } catch (e) { ctx.toast(e.message, 'err'); }
    setTimeout(() => setStage('result'), 900);
  };
  const meds = B.meds.filter(m => m.is_active).map(m => `${m.name} ${m.dose}`).join(', ');
  const email = `To: ${vet?.email || '(your vet\'s email)'}\nSubject: ${pet.name} (${[pet.breed, ageOf(pet.birth_date)].filter(Boolean).join(', ')}): ${L.label.toLowerCase()}\n\nSymptoms: ${chips.join(', ') || 'see note'}. ${text.trim()}\nCurrent meds: ${meds || 'none'}.\nAllergies: ${pet.pet_health.allergies.join(', ') || 'none recorded'}.\nConditions: ${pet.pet_health.conditions.join(', ') || 'none recorded'}.`;
  const tone = { red: ['var(--red-soft)', 'var(--red)'], amber: ['var(--amber-soft)', 'var(--amber)'], mint: ['var(--mint-soft)', 'var(--mint-ink)'] }[L.tone];
  return html`<div class="screen">
    <${TopBar} title="Emergency help" onBack=${() => ctx.go('home')} />

        <pre style="margin:0;white-space:pre-wrap;font:600 13.5px/1.5 var(--body);color:var(--ink-2);user-select:all">${email}</pre>

      </div>
      <button class="btn ghost" onClick=${() => { setStage('input'); setChips([]); setText(''); setPhoto(null); }}>Start over</button>
    </div>`}
    <p class="small" style="margin:0">PetMate gives general information only and can't examine your pet. When in doubt, contact a vet.</p>
  </div>`;
}

/* =============================== App shell =============================== */
function App() {
  const [api, setApi] = useState(null);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [pets, setPets] = useState([]);
  const [petId, setPetId] = useState(null);
  const [bundle, setBundle] = useState(null);
  const [screen, setScreen] = useState('welcome');
  const [sheet, setSheet] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [viewToken, setViewToken] = useState(null);
  const [booting, setBooting] = useState(true);
  const scrollRef = useRef();
  const resetRef = useRef(false);
  const toastT = useRef();
  const day = todayISO();
  const publicToken = useMemo(() => { try { return new URLSearchParams(location.search).get('share'); } catch { return null; } }, []);

  const toast = (msg, kind) => { setToastMsg({ msg, kind }); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToastMsg(null), kind === 'err' ? 4200 : 2600); };
  const loadFor = async (a, keepId) => {
    const s = await a.session(); setSession(s);
    if (!s) { setPets([]); setBundle(null); setProfile(null); return { s, ps: [] }; }
    const [pr, ps] = await Promise.all([a.profile(), a.pets()]);
    setProfile(pr); setPets(ps);
    const id = keepId && ps.some(p => p.id === keepId) ? keepId : ps[0]?.id || null;
    setPetId(id);
    setBundle(id ? await a.bundle(id, day) : null);
    return { s, ps };
  };

  useEffect(() => {
    (async () => {
      const live = await canReachSupabase();
      const a = live ? makeLiveApi() : makeDemoApi();
      await a.init();
      setApi(a);
      if (publicToken && live) { setBooting(false); return; }
      try {
        const { s, ps } = await loadFor(a);
        if (s) setScreen(ps.length ? 'home' : 'ob');
      } catch (e) { toast(e.message, 'err'); }
      setBooting(false);
      a.onAuth(async evt => {
        try {
          const { s, ps } = await loadFor(a);
          if (s && (evt === 'PASSWORD_RECOVERY' || resetRef.current)) { setScreen('newpassword'); return; }
          setScreen(sc => !s ? 'welcome' : sc === 'newpassword' ? sc : !ps.length ? 'ob' : ['welcome', 'signin', 'signup'].includes(sc) ? 'home' : sc);
        }
        catch (e) { toast(e.message, 'err'); }
      });
    })();
  }, []);
  useEffect(() => { scrollRef.current && (scrollRef.current.scrollTop = 0); }, [screen]);

  const pet = pets.find(p => p.id === petId) || null;
  const go = s => { setSheet(null); if (s === 'ob' && api?.mode === 'live' && !session) { setScreen('signup'); return; } setScreen(s); };
  const ctx = {
    api, session, profile, pets, pet, bundle, day, screen, go, toast,
    openSheet: setSheet, closeSheet: () => setSheet(null),
    refresh: async id => { await loadFor(api, id || petId); },
    selectPet: async id => { setPetId(id); setBundle(await api.bundle(id, day)); },
    run: async (fn, ok) => { try { await fn(); await loadFor(api, petId); ok && toast(ok); } catch (e) { toast(e.message, 'err'); } },
    toggleTask: async t => {
      setBundle(b => ({ ...b, tasksToday: b.tasksToday.map(x => x.id === t.id ? { ...x, done: !t.done } : x) }));
      try { await api.toggleTask(t.id, day, !t.done); } catch (e) { toast(e.message, 'err'); loadFor(api, petId); }
    },
    toggleDose: async d => {
      setBundle(b => ({ ...b, doses: b.doses.map(x => x.schedule_id === d.schedule_id ? { ...x, given: !d.given } : x) }));
      try { await api.toggleDose(d.schedule_id, day, !d.given); if (!d.given) toast(`${d.name} marked given`); } catch (e) { toast(e.message, 'err'); loadFor(api, petId); }
    },
    revokeShare: async id => { try { await api.revokeShare(id); await loadFor(api, petId); toast('Link revoked. It stops working now.'); } catch (e) { toast(e.message, 'err'); } },
    signOut: async () => { await api.signOut(); setSheet(null); setScreen('welcome'); await loadFor(api); },
    showShare: token => { setViewToken(token); setScreen('shareview'); },
    startPasswordReset: () => { resetRef.current = true; },
    cancelPasswordReset: () => { resetRef.current = false; },
    finishPasswordReset: async () => { resetRef.current = false; const { ps } = await loadFor(api, petId); setScreen(ps.length ? 'home' : 'ob'); },
  };

  if (!api || booting) return html`<div class="shell"><div class="phone"><div class="center"><img class="logo-stacked" src=${LOGO.stacked} alt="PetMate" width="170" height="149" /><span class="spinner"></span></div></div></div>`;
  if (publicToken && api.mode === 'live') return html`<div class="shell"><div class="phone"><div class="scroll"><${ShareView} ctx=${ctx} token=${publicToken} standalone /></div></div></div>`;

  const ready = pet && bundle;
  const S = NEEDS_PET.has(screen) && !ready ? (session ? 'ob' : 'welcome') : screen;
  const body = {
    welcome: () => html`<${Welcome} ctx=${ctx} />`, signin: () => html`<${Auth} key="signin" ctx=${ctx} start="signin" />`, signup: () => html`<${Auth} key="signup" ctx=${ctx} start="signup" />`, newpassword: () => html`<${NewPassword} ctx=${ctx} />`, ob: () => html`<${Onboarding} ctx=${ctx} />`,
    home: () => html`<${Home} ctx=${ctx} />`, profile: () => html`<${Profile} ctx=${ctx} />`, routine: () => html`<${Routine} key=${pet.id} ctx=${ctx} />`,
    handoff: () => html`<${Handoff} ctx=${ctx} />`, meds: () => html`<${Meds} ctx=${ctx} />`, ask: () => html`<${Ask} ctx=${ctx} />`,
    scan: () => html`<${Scan} key=${pet.id} ctx=${ctx} />`, emergency: () => html`<${Emergency} ctx=${ctx} />`, datamap: () => html`<${DataMap} ctx=${ctx} />`,
    shareview: () => html`<${ShareView} ctx=${ctx} token=${viewToken} />`,
  }[S]();
  const tabs = [['home', 'Home', 'home'], ['routine', 'Routine', 'checklist'], ['ask', 'Ask', 'auto_awesome'], ['meds', 'Meds', 'medication'], ['profile', pet?.name || 'Pet', 'pets']];
  const showTabs = ready && !['welcome', 'signin', 'signup', 'newpassword', 'ob', 'datamap', 'shareview'].includes(S);
  const groups = [...new Set(SCREENS.map(s => s[3]))];
  const sheetBody = sheet && {
    link: () => html`<${LinkSheet} ctx=${ctx} ...${sheet} />`, routineSaved: () => html`<${RoutineSavedSheet} ctx=${ctx} />`,
    med: () => html`<${MedSheet} ctx=${ctx} docId=${sheet.docId} initialText=${sheet.text} />`, vaccine: () => html`<${VaccineSheet} ctx=${ctx} />`,
    weight: () => html`<${WeightSheet} ctx=${ctx} />`, editPet: () => html`<${EditPetSheet} ctx=${ctx} />`, account: () => html`<${AccountSheet} ctx=${ctx} />`, password: () => html`<${PasswordSheet} ctx=${ctx} />`, mode: () => html`<${ModeSheet} ctx=${ctx} />`,
  }[sheet.type]?.();

  return html`<div class="shell">
    <aside class="rail" aria-label="Screens">
      <img class="logo-wordmark" src=${LOGO.wordmark} alt="PetMate" width="220" height="72" />
      <p>Pet care records for owners, shared safely with sitters, kennels and vets.</p>
      <div><${ModeBadge} ctx=${ctx} /></div>
      ${groups.map(g => html`<nav key=${g} class="rail-group"><h4>${g}</h4>${SCREENS.filter(s => s[3] === g).map(([k, l, i]) => html`<button key=${k} class=${`rail-link ${S === k ? 'on' : ''}`} disabled=${NEEDS_PET.has(k) && !ready} style=${NEEDS_PET.has(k) && !ready ? 'opacity:.45;cursor:not-allowed' : ''} onClick=${() => go(k)}><${Icon} n=${i} />${l}</button>`)}</nav>`)}
      ${!ready && html`<p class="small">Sign in or create a pet profile to open the care tools.</p>`}
    </aside>
    <main class="phone">
      <div class="scroll" ref=${scrollRef}>${body}</div>
      ${showTabs && html`<nav class="tabbar" aria-label="Main">${tabs.map(([k, l, i]) => html`<button key=${k} class=${`tab ${k === 'ask' ? 'mid' : ''} ${S === k ? 'on' : ''}`} aria-current=${S === k ? 'page' : null} onClick=${() => go(k)}>${k === 'ask' ? html`<span class="bub"><${Icon} n=${i} fill /></span>` : html`<${Icon} n=${i} fill=${S === k} />`}<span>${l}</span></button>`)}</nav>`}
      ${sheet && html`<div class="scrim" onClick=${e => e.target === e.currentTarget && setSheet(null)}><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${sheetBody}</div></div>`}
      ${toastMsg && html`<div class=${`toast ${toastMsg.kind === 'err' ? 'err' : ''}`} role="status"><${Icon} n=${toastMsg.kind === 'err' ? 'error' : 'check_circle'} fill />${toastMsg.msg}</div>`}
    </main>
  </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body></html>
